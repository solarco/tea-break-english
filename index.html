<script>
const EPISODES = [{"date": "2026-10-09", "row": "<div class=\"ep-row\" data-date=\"2026-10-09\"><div class=\"ep-row-title\">茶水间英文 - 10月9日 | 和平奖揭晓、OpenAI营收乌龙、咖啡配卷饼</div><div class=\"ep-row-hook\">Nobel Prize drama, OpenAI&#x27;s $20B oopsie, and coffee meets burrito.</div><div class=\"ep-row-meta\">2026-10-09 · 全文 795 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月9日 | 和平奖揭晓、OpenAI营收乌龙、咖啡配卷饼</h2>\n      <div class=\"meta\">2026-10-09 · 全文 795 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　诺贝尔和平奖揭晓；OpenAI 营收预期上演 200 亿美元乌龙反转；星巴克前 CEO 或推动与 Chipotle 合并，咖啡配卷饼？</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-09.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>和平奖揭晓</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The Nobel Peace Prize. It was just announced, and it went to an eighty-five-year-old human rights lawyer from South Africa named Navi Pillay.</p><p class=\"zh\">诺贝尔和平奖刚揭晓，颁给了85岁的南非人权律师 Navi Pillay。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Eighty-five and winning a Nobel Prize. I can barely get out of bed without groaning.</p><p class=\"zh\">85岁拿诺奖，我起床都费劲还哼哼唧唧的。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And her life story is incredible. She was born in South Africa during apartheid, became one of the first women to open her own law practice there, and defended activists fighting apartheid, including people connected to Nelson Mandela.</p><p class=\"zh\">她的人生太传奇了：生于种族隔离时期的南非，是当地最早自己开律所的女性之一，为反种族隔离的活动家辩护，其中还有曼德拉身边的人。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And here is the funny part. When the news broke, she was at a conference in Germany, and the room gave her a long standing ovation.</p><p class=\"zh\">好玩的是，消息公布时她正在德国开会，全场起立鼓掌了好久。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And she joked, if you clap a little bit more, maybe I will share the prize with you. Here is your small talk line for story one. Did you hear who won the Nobel Peace Prize? An eighty-five-year-old lawyer who spent her life fighting apartheid. Proof that it is never too late to get your flowers. Story two. The artificial intelligence market had a week like a roller coaster, and it all came down to one confusing number.</p><p class=\"zh\">她还开玩笑说，再多鼓点掌，没准我分你们一半奖金。第一条开场白：听说谁拿了诺贝尔和平奖吗？一位85岁的律师，一辈子反种族隔离。开花结果永远不嫌晚。第二条，AI 市场这周跟过山车似的，全因为一个让人糊涂的数字。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>OpenAI营收乌龙</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I saw this. On Thursday, a report said OpenAI, the company behind ChatGPT, told investors its annualized revenue was about fifty billion dollars, not the seventy billion people were expecting.</p><p class=\"zh\">我看到了。周四有报道说，ChatGPT 背后的 OpenAI 告诉投资人，它的年化营收大概500亿美元，不是市场预期的700亿。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Twenty billion dollars lower. Markets panicked. Chip stocks like Nvidia, CoreWeave, and Oracle all fell hard. People started asking, is the AI bubble finally popping?</p><p class=\"zh\">少了200亿，市场慌了。Nvidia、CoreWeave、甲骨文这些芯片股全跌惨了，大家开始问：AI 泡沫终于要破了？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Then the plot twist. On Friday, a different report said OpenAI actually expects to reach seventy billion dollars or more in annualized revenue by year end. So markets flipped right back up. Turns out the whole scare was basically an accounting question.</p><p class=\"zh\">然后反转来了。周五另一份报道说，OpenAI 预计年底年化营收能到700亿甚至更多。市场立马涨回去。搞了半天，这场惊吓就是个会计口径问题。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Explain that in plain English.</p><p class=\"zh\">说人话。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">OpenAI counts its revenue differently from its rival Anthropic. Anthropic includes money that comes through cloud partners like Amazon and Google. OpenAI does not. So the two numbers were never apples to apples. A twenty-billion-dollar gap, one scary headline, one reassuring headline, and billions of dollars of market value moved on a footnote. Here is your stealable line. Did you see what happened with OpenAI&#x27;s revenue numbers? One report sent chip stocks tumbling, the next day another report sent them right back up. It was just an accounting difference. Story three, and this one is fun. Starbucks has been exploring a takeover of Chipotle.</p><p class=\"zh\">OpenAI 和对手 Anthropic 的营收算法不一样：Anthropic 把经亚马逊、谷歌云来的钱也算上，OpenAI 不算。所以这俩数字从一开始就没法直接比。200亿的差距，一个吓人的标题，一个安抚的标题，几千亿市值就跟着脚注上下翻飞。开场白拿走：看到 OpenAI 营收那出乌龙没？一份报告把芯片股砸下去，第二天另一份又拉回来，闹了半天就是会计口径不同。第三条好玩了：星巴克在琢磨收购 Chipotle。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>咖啡配卷饼</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">My morning coffee and my lunch burrito, from the same company? My wallet just got nervous.</p><p class=\"zh\">早上的咖啡和中午的卷饼，一家公司出？我的钱包已经开始紧张了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The Financial Times reported on Thursday that Starbucks has been working with advisers on a takeover proposal for Chipotle, which is worth almost thirty-nine billion dollars.</p><p class=\"zh\">金融时报周四报道，星巴克一直在和投行顾问琢磨收购 Chipotle 的方案，后者市值近390亿美元。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And here is the twist. The CEO of Starbucks, Brian Niccol, used to run Chipotle for six years. He turned it around after its food safety problems, then jumped to Starbucks two years ago.</p><p class=\"zh\">转折来了：星巴克现任 CEO Brian Niccol 以前在 Chipotle 干了六年老大，食品安全危机后是他把公司救回来的，两年前才跳槽到星巴克。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">So this would be a homecoming. Analysts say a combined company could have fifty billion dollars in annual sales. That would be one of the biggest restaurant deals ever.</p><p class=\"zh\">所以这算回家。分析师说合并后年销售额能到500亿美元，会是餐饮史上最大的交易之一。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">But analysts are also skeptical, because Starbucks is still in the middle of its own turnaround, fixing slow service and long lines.</p><p class=\"zh\">但分析师也怀疑，毕竟星巴克自己还在转型期，出餐慢、排队长的问题还没搞定呢。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Chipotle&#x27;s stock jumped about six percent, while Starbucks fell about three percent. Investors are basically saying, nice idea, but can you afford it?</p><p class=\"zh\">Chipotle 股价涨了6%左右，星巴克跌了3%。投资人的意思很明白：想法不错，但你买得起吗？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">I just want to know if my burrito bowl comes with a free espresso shot now. Your stealable line for story three. Did you hear Starbucks might buy Chipotle? Your latte and your burrito could soon come from the same company. The CEO used to run Chipotle, so it would be a homecoming.</p><p class=\"zh\">我就想知道以后卷饼碗能不能送一杯浓缩。第三条开场白：听说星巴克可能要买 Chipotle？你的拿铁和卷饼以后可能是一家出的，CEO 以前就是 Chipotle 的老大，算回家了。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Now, the random question of the day. If you could swap lives with one animal for a day, which animal would you choose?</p><p class=\"zh\">快问时间：如果能和一种动物交换一天的生活，你选哪种？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Easy. A cat. Sleep twenty hours a day, get fed on schedule, knock things off tables just to watch humans pick them up.</p><p class=\"zh\">简单，猫。每天睡20小时，饭点有人喂，没事把桌上东西推下去看人类捡。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Very on brand. I would pick a sea otter. They float on their backs, they hold hands so they do not drift apart, and they smash shellfish on their bellies like tiny chefs.</p><p class=\"zh\">很符合你的人设。我选海獭，仰面漂在水上，还会牵手防止被冲散，拿贝壳在肚皮上敲，跟小厨师似的。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">A sea otter is an excellent answer. Although being a wild animal means no room service.</p><p class=\"zh\">海獭这答案不错。不过野生动物可没有客房服务。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">True, but being a house cat means no dignity. You are a furry freeloading roommate.</p><p class=\"zh\">也是，但家猫也没尊严啊，就是个毛茸茸的蹭吃蹭住室友。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Listeners, what animal would you swap with for a day? Steal this question for your group chat tonight.</p><p class=\"zh\">听众朋友们，你们想跟哪种动物换一天？今晚就把这个问题丢进群聊。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>standing ovation</b><span>起立鼓掌；经久不息的掌声</span></li><li><b>roller coaster</b><span>大起大落；像过山车一样</span></li><li><b>rebound</b><span>反弹；回升</span></li><li><b>apples to apples</b><span>同类比较；在同一基准上</span></li><li><b>homecoming</b><span>回归；重返旧主</span></li><li><b>vote with one&#x27;s wallet</b><span>用钱包投票；用消费表态</span></li><li><b>freeloading</b><span>蹭吃蹭喝；白吃白住</span></li></ul></div>\n    </article>"}, {"date": "2026-10-08", "row": "<div class=\"ep-row\" data-date=\"2026-10-08\"><div class=\"ep-row-title\">茶水间英文 - 10月8日 | 好莱坞大合并、大空头唱衰AI、道奇约战酿酒人</div><div class=\"ep-row-hook\">Hollywood&#x27;s $110B merger, the Big Short guy vs. AI, and Dodgers vs. Brewers.</div><div class=\"ep-row-meta\">2026-10-08 · 全文 751 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月8日 | 好莱坞大合并、大空头唱衰AI、道奇约战酿酒人</h2>\n      <div class=\"meta\">2026-10-08 · 全文 751 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　派拉蒙 1100 亿美元完成对华纳兄弟的收购；《大空头》原型 Michael Burry 唱衰 AI 泡沫；道奇与酿酒人会师国联冠军赛。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-08.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>好莱坞大合并</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">We sure do. Paramount has officially completed its takeover of Warner Brothers, and the price tag is one hundred ten billion dollars.</p><p class=\"zh\">必须的。派拉蒙正式完成了对华纳兄弟的收购，1100亿美元。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">One hundred ten billion. That is the no-brainer headline of the week. And here is the twist. They are not calling it Paramount anymore. The whole combined company is now called Skydance.</p><p class=\"zh\">1100亿，本周最不用动脑的头条。转折来了：合并后的公司不叫派拉蒙了，改名叫 Skydance。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Right. David Ellison, the producer behind Top Gun Maverick, is now the chairman and C E O, and he controls Paramount Pictures, Warner Brothers, H B O, C N N, C B S, Paramount Plus, and H B O Max.</p><p class=\"zh\">对，《壮志凌云2》的制片人 David Ellison 现在是董事长兼 CEO，派拉蒙影业、华纳兄弟、HBO、CNN、CBS、Paramount Plus、HBO Max 全归他管了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And the toy box is unreal. Harry Potter, Game of Thrones, D C Comics, Star Trek, SpongeBob. One company now owns most of your childhood.</p><p class=\"zh\">这 IP 库太离谱了：哈利·波特、权力的游戏、DC 漫画、星际迷航、海绵宝宝。一家公司拥有了你的大半童年。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The scale is wild. Nearly seventy billion in yearly revenue, more than two hundred million subscribers, and six billion in cost savings targeted over three years.</p><p class=\"zh\">规模吓人：年营收近700亿，订阅用户超2亿，三年要砍60亿成本。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">They promise it will make the company leaner and more nimble, which is corporate speak for fewer desks.</p><p class=\"zh\">他们说这会让公司更精益灵活，翻译一下就是：少摆几张办公桌（裁员）。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">True. But we might finally get one streaming app instead of two, and I would love to pay only once. Here is your line to steal today. Did you hear Paramount just bought Warner Brothers for one hundred ten billion dollars? One company now owns Harry Potter, Batman, and SpongeBob.</p><p class=\"zh\">确实。不过我们终于可能只要装一个流媒体 App 了，付一次钱多好。今天的开场白：听说派拉蒙1100亿美元买下华纳兄弟了吗？一家公司现在拥有哈利·波特、蝙蝠侠和海绵宝宝。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>大空头唱衰AI</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Story number two is a total mood swing from yesterday. The guy from The Big Short has entered the chat.</p><p class=\"zh\">第二条跟昨天画风突变：《大空头》那哥们进群了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Michael Burry. The investor who called the housing crash in two thousand eight. He just wrote on Substack that all of this A I spending could end up as sunk cost.</p><p class=\"zh\">Michael Burry，就是2008年押中次贷危机的那个投资人。他刚在 Substack 上写，所有这些 AI 投入最后可能都变成沉没成本。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Sunk cost. Money you spend and never get back. His argument is something he calls compression. Once A I gets cheaper to run, he thinks all these giant data centers will not be worth what they cost.</p><p class=\"zh\">沉没成本，就是花了拿不回来的钱。他的论点叫“压缩”：一旦 AI 运行成本降下来，这些巨型数据中心就不值那个价了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">He also says Open A I and Anthropic are trying to muscle into Big Tech&#x27;s oligopoly, but he doubts it is sustainable, and he sees a sizable market correction coming in the next few months.</p><p class=\"zh\">他还说 OpenAI 和 Anthropic 想挤进大科技公司的寡头圈，但他觉得持续不了，未来几个月会有不小的市场回调。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Meanwhile, Nvidia keeps hitting record highs. The market is going full speed ahead, and Burry is standing on the tracks waving a red flag.</p><p class=\"zh\">与此同时 Nvidia 还在创新高。市场全速前进，Burry 站在铁轨上挥红旗。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Perfect watercooler material. You sound smart no matter which side you take. Here is your line to steal. So apparently the Big Short guy thinks all this A I spending could become sunk cost. Is the A I boom a gold rush or a bubble?</p><p class=\"zh\">完美的茶水间话题，站哪边都显得你懂行。开场白拿走：听说《大空头》那位觉得这些 AI 投入可能打水漂？AI 到底是淘金热还是泡沫？</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>道奇约战酿酒人</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And for our third story, let us head to the ballpark, because October baseball just got very spicy.</p><p class=\"zh\">第三条，去棒球场，十月棒球火药味十足。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Spicy is the word. The National League Championship Series is set, and it is a rematch. The Milwaukee Brewers against the Los Angeles Dodgers.</p><p class=\"zh\">火药味这个词精准。国联冠军赛对阵出炉，还是老冤家：密尔沃基酿酒人对洛杉矶道奇。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The Brewers beat the Padres three games to one last night in San Diego. And the Dodgers beat the Braves four to one in Atlanta.</p><p class=\"zh\">酿酒人昨晚在圣迭戈3比1干掉教士，道奇在亚特兰大4比1拿下勇士。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">This is classic David versus Goliath. Small market versus big market. The Dodgers are chasing their third straight World Series title, while the Brewers have never won a championship. Not once.</p><p class=\"zh\">经典的大卫战歌利亚：小市场对大市场。道奇冲击三连冠，酿酒人一次冠军都没拿过，一次都没有。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Over in the American League, the Rays just swept the Yankees. Three games, zero wins for New York. Yankees fans are melting down as we speak.</p><p class=\"zh\">美联那边，光芒横扫了洋基，三场全胜。洋基球迷现在正在崩溃中。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And the White Sox lead the Guardians two games to one, after Cleveland punched back with a nine to three win last night. Game four is tonight in Chicago.</p><p class=\"zh\">白袜2比1领先守护者，克利夫兰昨晚9比3扳回一城，第四场今晚在芝加哥打。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So much baseball. Here is your line to steal. Have you seen the playoff picture? The Brewers and Dodgers are facing off again, and the Rays just swept the Yankees. October baseball never disappoints.</p><p class=\"zh\">棒球大餐。开场白拿走：看了季后赛对阵没？酿酒人和道奇又碰上了，光芒还横扫了洋基。十月棒球从不让人失望。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Time for our random question of the day. If you could mute one everyday sound forever, what would it be?</p><p class=\"zh\">快问时间：如果能永远静音一种日常声音，你选哪个？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Oh, easy. The alarm clock. That sound is pure evil.</p><p class=\"zh\">简单，闹钟。那声音纯纯的恶。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Fair, but mine is the microwave beep. It keeps beeping like it has a personal grudge against me.</p><p class=\"zh\">有道理，但我选微波炉的滴滴声。它滴起来像跟我有私人恩怨。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Ha. What about the leaf blower? My neighbor fires his up at eight A M on Saturdays.</p><p class=\"zh\">哈，那吹叶机呢？我邻居每周六早上八点准时开工。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Okay, that wins. Actually, no. The seatbelt ding in the car. It judges you for a full thirty seconds.</p><p class=\"zh\">行，这个赢了。等等，不对，汽车安全带提示音才是最烦的，它审判你整整30秒。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">True. Listeners, your turn. What sound would you mute forever? Ask a friend today.</p><p class=\"zh\">确实。听众朋友们轮到你们了：你想静音哪种声音？今天拿去问朋友。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>no-brainer</b><span>不用动脑的选择；显而易见</span></li><li><b>corporate speak</b><span>企业黑话；官话</span></li><li><b>sunk cost</b><span>沉没成本</span></li><li><b>muscle into</b><span>挤进；强行进入</span></li><li><b>David versus Goliath</b><span>大卫战歌利亚；以小搏大</span></li><li><b>melt down</b><span>（情绪）崩溃</span></li></ul></div>\n    </article>"}, {"date": "2026-10-07", "row": "<div class=\"ep-row\" data-date=\"2026-10-07\"><div class=\"ep-row-title\">茶水间英文 - 10月7日 | 梅西谢幕战、芯片豪赌、Uber大收购</div><div class=\"ep-row-hook\">Messi bids farewell, SpaceX bets $40B on chips, and Uber buys your lunch.</div><div class=\"ep-row-meta\">2026-10-07 · 全文 652 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月7日 | 梅西谢幕战、芯片豪赌、Uber大收购</h2>\n      <div class=\"meta\">2026-10-07 · 全文 652 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　梅西踢完阿根廷国家队谢幕战；SpaceX 拟筹 400 亿美元押注 AI 芯片；Uber 23 亿美元收购企业订餐公司 EzCater。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-07.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>梅西谢幕战</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Story number one, and honestly, the story of the week. Lionel Messi played his very last game for Argentina last night.</p><p class=\"zh\">第一条，说实话也是本周最大的新闻：Lionel Messi 昨晚踢了为阿根廷的最后一场比赛。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Twenty-one years, two hundred and eight games, one hundred and twenty-six goals. And the final act was perfect. A friendly against Benin in Buenos Aires, Argentina won three to zero, and Messi scored one and set up the other two.</p><p class=\"zh\">21年，208场比赛，126个进球。谢幕战完美收官：在布宜诺斯艾利斯对阵贝宁的友谊赛，阿根廷3比0获胜，Messi 一球两助攻。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">One goal, two assists, in front of eighty-five thousand people at the Monumental stadium. He wiped away tears as he walked off, and then a drone show lit up the sky above the stadium to say goodbye.</p><p class=\"zh\">一球两助攻，在纪念碑球场8万5千名观众面前。他离场时擦去眼泪，随后无人机表演点亮球场夜空为他送别。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Argentines have been dreading this for years. People there say, thank God they were born in the era of Messi.</p><p class=\"zh\">阿根廷人怕这一天怕了好几年。那边的人说，感谢上帝让他们生在了 Messi 的时代。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And here is your stealable line. Did you hear Messi played his last game for Argentina? One goal, two assists, and a drone show send-off. Not a bad way to say goodbye.</p><p class=\"zh\">开场白拿走：听说了吗，Messi 踢了为阿根廷的最后一场？一球两助攻，还有无人机送别。这告别方式不赖。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>芯片豪赌</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Story number two. Forty billion dollars. That is what SpaceX is trying to raise, according to the Financial Times.</p><p class=\"zh\">第二条：400亿美元。据金融时报，SpaceX 正在筹这么多钱。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The plan is ten billion in bank loans plus thirty billion in investment-grade debt, led by the asset manager Apollo, and the money goes straight to Nvidia for A I chips.</p><p class=\"zh\">计划是100亿银行贷款加300亿投资级债券，由资管公司 Apollo 牵头，钱直接给 Nvidia 买 AI 芯片。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The rocket company is becoming an A I company. Musk says the Colossus data centers will use Nvidia hardware exclusively, and the new Colossus two could more than double its chip count by December.</p><p class=\"zh\">火箭公司要变成 AI 公司了。Musk 说 Colossus 数据中心只用 Nvidia 的硬件，新一代 Colossus 2 到12月芯片数可能翻倍还多。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The scale of the spending is wild. Morgan Stanley estimates that A I infrastructure will need one point five trillion dollars in outside financing by twenty twenty-eight.</p><p class=\"zh\">这花钱规模太疯了。摩根士丹利估计，到2028年 AI 基建需要1.5万亿美元的外部融资。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So basically, everyone is mortgaging the future to buy chips. Steal this line. So apparently SpaceX is raising forty billion dollars just to buy Nvidia chips. The A I gold rush is eating everyone&#x27;s lunch.</p><p class=\"zh\">说白了，大家都在抵押未来买芯片。开场白拿走：听说 SpaceX 筹400亿美元就为了买 Nvidia 芯片？AI 淘金热把所有人的饭碗都抢了。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>Uber大收购</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Story number three, and this one is personal for anyone who orders lunch at work. Uber is buying ezCater, the office catering platform, for two point three billion dollars in cash.</p><p class=\"zh\">第三条，跟每个上班点外卖的人都有关：Uber 花23亿美元现金收购了企业订餐平台 ezCater。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">EzCater lets companies order food from over one hundred and forty thousand restaurants for meetings and office events. The average order is over four hundred dollars. Your lunch order is pocket change next to that.</p><p class=\"zh\">ezCater 让公司能从14万多家餐厅给会议和团建订餐，平均一单400多美元。跟你那份午饭比，这才是大钱。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The company handled over two point five billion dollars in bookings last year. Uber wants to plug it into Uber Eats and Uber for Business, and honestly this is about catching up with DoorDash, which still owns the American delivery market.</p><p class=\"zh\">这公司去年经手的订单超过25亿美元。Uber 想把它接进 Uber Eats 和企业版，说白了就是为了追赶 DoorDash——美国外卖市场还是人家的天下。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And Uber is not done shopping. It is still working on that fourteen point eight billion dollar bid for Delivery Hero. Nobody in this economy is going hungry.</p><p class=\"zh\">Uber 还没买够，对 Delivery Hero 148亿美元的报价还在谈。这年头，没人会饿着。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Stealable line. Did you see Uber just bought a catering company for two point three billion? Your next team lunch might come from Uber Eats.</p><p class=\"zh\">开场白拿走：看到没，Uber 刚花23亿买了家订餐公司？你下次团建的午饭可能就是 Uber Eats 送的。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">All right, time for the random question. Alex, if you could instantly become world-class at one completely useless skill, what would it be?</p><p class=\"zh\">好，快问时间。Alex，如果能瞬间掌握一项毫无用处的世界级技能，你选什么？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Whistling. Not cute whistling. Concert-level, four-octave, make-the-dogs-cry whistling. Every room I enter, whistling. I would be the instant celebrity of every grocery store line.</p><p class=\"zh\">吹口哨。不是可爱的那种，是音乐会级别、四个八度、能把狗吹哭的那种。我走进每个房间都吹着口哨，超市排队区的人气王就是我。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Mine would be solving a Rubik&#x27;s cube with my feet. No practical use, nobody asked for it, but imagine the party trick at a dinner table.</p><p class=\"zh\">我选脚拧魔方。毫无用处，没人想看，但想象一下饭桌上这操作。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Whose dinner table has room for foot cube solving?</p><p class=\"zh\">谁家饭桌腾得开地方给你脚拧魔方？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Every dinner table, once they see me. That is the whole point.</p><p class=\"zh\">看到我之后，每家饭桌都有地方。这就是精髓。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Okay listeners, steal this one today. Ask a friend what useless skill they would master. You will learn something weird, I promise.</p><p class=\"zh\">好，听众朋友们，今天就把这个问题拿去问朋友，保证挖出点奇怪的东西。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>send-off</b><span>送别；告别仪式</span></li><li><b>dread</b><span>想到就发怵；害怕</span></li><li><b>mortgage the future</b><span>抵押未来；透支未来</span></li><li><b>eat one&#x27;s lunch</b><span>抢饭碗；碾压对手</span></li><li><b>pocket change</b><span>小钱；零钱</span></li><li><b>catering</b><span>（企业）订餐服务</span></li></ul></div>\n    </article>"}, {"date": "2026-10-06", "row": "<div class=\"ep-row\" data-date=\"2026-10-06\"><div class=\"ep-row-title\">茶水间英文 - 10月6日 | 马斯克重回万亿、欧洲AI叫板中国、外星球来电了</div><div class=\"ep-row-hook\">Musk&#x27;s back in the trillion club, Europe crashes the AI race, and scientists hear a distant world hum.</div><div class=\"ep-row-meta\">2026-10-06 · 全文 805 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月6日 | 马斯克重回万亿、欧洲AI叫板中国、外星球来电了</h2>\n      <div class=\"meta\">2026-10-06 · 全文 805 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　马斯克身家重回一万亿美元；欧洲 Mistral 叫板中美 AI 竞赛；科学家首次“听到”系外行星的极光电波。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-06.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>马斯克重回万亿</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">First up, the money story everyone is talking about. Elon Musk is a trillionaire again.</p><p class=\"zh\">先来聊大家都在谈的金钱话题：Elon Musk 又成万亿富翁了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Again? How many times has this man joined the trillionaire club?</p><p class=\"zh\">又？这哥们都第几次加入万亿俱乐部了？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">His fortune jumped by sixty-five billion dollars to one point zero four trillion dollars, thanks to Tesla stock climbing almost seven percent and SpaceX shares jumping thirteen percent since the start of October.</p><p class=\"zh\">他的身家涨了650亿美元，达到1.04万亿美元。多亏特斯拉股价涨了近7%，SpaceX 的估值自10月初以来也涨了13%。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">One point zero four trillion. I cannot even picture that number. That is like, what, a million million?</p><p class=\"zh\">1.04万亿，我根本想象不出这是多少钱。大概就是……一百万个一百万？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">A thousand billions, if that helps. And he is not the only winner. The Nasdaq stock index closed at a record high yesterday, and the S and P five hundred is less than one percent away from its own record.</p><p class=\"zh\">这么说吧，就是一千个十亿，这样好理解点了吧。而且不止他一个人赚钱，纳斯达克昨天收盘创历史新高，标普500离自己的纪录也只差不到1%。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the market is basically partying. Oil prices fell a bit, bond yields pulled back from a twenty-four year high, and suddenly everyone feels rich again.</p><p class=\"zh\">所以市场 basically 在开派对。油价跌了点，债券收益率从24年高点回落，突然大家又觉得自己有钱了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly. It is the classic Wall Street mood swing. One week everyone is nervous, the next week it is champagne.</p><p class=\"zh\">没错，典型的华尔街情绪过山车。这周大家还紧张呢，下周就开香槟了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Well, not everyone. My wallet did not get the memo.</p><p class=\"zh\">倒也不是所有人。反正我的钱包没收到通知。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Ha. Fair enough. But here is your line for the watercooler. Did you hear Elon Musk is a trillionaire again? One point zero four trillion dollars. Wild.</p><p class=\"zh\">哈哈，有道理。不过茶水间开场白来了：听说了吗，Elon Musk 又成万亿富翁了？1.04万亿，疯了吧。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>欧洲AI叫板中国</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Okay, story number two, and this one is about the global A I race heating up.</p><p class=\"zh\">好，第二条，全球 AI 竞赛升温了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh, I like this one. Europe just crashed the party.</p><p class=\"zh\">哦这条我喜欢。欧洲来搅局了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is right. Arthur Mensch, the C E O of the French A I company Mistral, said on Tuesday that their brand new model beats Chinese models on cybersecurity, and the full reveal is coming later today.</p><p class=\"zh\">没错。法国 AI 公司 Mistral 的 CEO Arthur Mensch 周二说，他们的新模型在网络安全上打败了中国模型，完整发布就在今天晚些时候。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Mistral is only three years old, but people call it Europe&#x27;s top contender in the A I race. They raised three billion euros last month at a twenty-one billion euro valuation.</p><p class=\"zh\">Mistral 才成立三年，但已经被称作欧洲 AI 竞赛的头号选手。上个月他们以210亿欧元估值融了30亿欧元。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And Mensch had a real mic drop moment. He said the narrative that Europe cannot compete is simply not true.</p><p class=\"zh\">Mensch 还放了个大招。他说“欧洲没法竞争”这种说法根本不成立。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The timing is perfect, because a new analysis just found that China has almost caught up with America. Chinese models now trail the top American ones by only three percent on key tests, down from fifteen percent earlier this year.</p><p class=\"zh\">时机选得真好，因为刚有一份新分析说中国快追上美国了。中国模型在关键测试上只落后美国顶尖模型3%，年初时还差15%呢。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is thanks to DeepSeek&#x27;s latest model, which scored eighty-one point one on a major benchmark. Still, only three of the top fifteen models worldwide are Chinese, and rankings change fast.</p><p class=\"zh\">这多亏了 DeepSeek 的最新模型，在一项重要基准测试里拿了81.1分。不过全球前十五的模型里只有三个是中国的，而且排名变得很快。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">So now it is a three-way race. America, China, and Europe all swinging. Your stealable line. So apparently Europe&#x27;s top A I lab says its new model beats the Chinese ones on cyber. The A I race just got a third runner.</p><p class=\"zh\">所以现在是三国杀了：美国、中国、欧洲都在发力。拿走这句开场白：听说欧洲顶尖 AI 实验室说他们的新模型在网络安全上超过了中国的，AI 竞赛迎来第三位选手。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>外星球来电了</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And for our lighter closer today, we are going to space. Kind of.</p><p class=\"zh\">今天轻松收尾，我们上太空。算是吧。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Oh no, are we doing aliens again? Listeners, I promise, Alex brings up aliens every month.</p><p class=\"zh\">不会吧，又要聊外星人？听众朋友们我保证，Alex 每个月都要提一次外星人。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Not aliens this time. Well, probably not aliens. Astronomers have detected the first ever radio signal coming directly from a planet outside our solar system.</p><p class=\"zh\">这次不是外星人。嗯，大概率不是。天文学家第一次探测到直接来自太阳系外行星的无线电信号。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Wait, for real? Like, a planet beaming us a message?</p><p class=\"zh\">等等，真的假的？一颗行星在给我们发消息？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">A gas giant called Beta Pictoris b, about sixty-three light-years away and twelve times the mass of Jupiter. But before you get excited, the scientists say it is not little green men. It is auroras.</p><p class=\"zh\">一颗叫 Beta Pictoris b 的气态巨行星，离我们63光年，质量是木星的12倍。但先别激动，科学家说不是小绿人，是极光。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Auroras? Like the northern lights?</p><p class=\"zh\">极光？就是北极光那种？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly like that, except this planet&#x27;s magnetic field is at least two hundred times stronger than Jupiter&#x27;s. So its light show is off the charts. A Harvard astronomer named Edo Berger said he knows radio signals make people think of aliens, but this is something very different.</p><p class=\"zh\">就是那种，只不过这颗行星的磁场至少是木星的200倍，所以它的灯光秀直接爆表。哈佛天文学家 Edo Berger 说，他知道无线电信号会让人想到外星人，但这次完全是另一回事。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Sixty-three light-years away and we can hear its magnetic field humming. That is honestly kind of beautiful.</p><p class=\"zh\">63光年外，我们能听到它磁场的嗡鸣。说实话，有点浪漫。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">It is the first time we have ever measured a magnetic field on another world. Your line for today. Have you heard? Scientists picked up a radio signal from a planet sixty-three light-years away. Not aliens, sadly. Just the universe&#x27;s biggest light show.</p><p class=\"zh\">这是人类第一次测到另一个世界的磁场。今天的开场白拿走：听说了吗，科学家收到了一颗63光年外行星的无线电信号。可惜不是外星人，只是宇宙最大的灯光秀。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Time for today&#x27;s random question. If your life had a theme song that played every time you walked into a room, what would yours be?</p><p class=\"zh\">快问时间：如果你的生活有主题曲，每次你走进房间就响起，你会选哪首？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Easy. The Imperial March. The Darth Vader music. I enter the office kitchen, the music swells, everyone freezes.</p><p class=\"zh\">简单。《帝国进行曲》，达斯·维达那个。我走进办公室茶水间，音乐响起，所有人定住。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Deeply dramatic for a man making instant noodles.</p><p class=\"zh\">一个煮泡面的人，戏这么足。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The noodles deserve drama. Yours?</p><p class=\"zh\">泡面值得拥有戏剧性。你呢？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">A kazoo attempting something heroic. Epic in my head, ridiculous out loud.</p><p class=\"zh\">卡祖笛吹的英雄曲。脑子里史诗级，吹出来像笑话。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">So I am a movie villain and you are a party favor with big dreams? Steal this one today and ask a friend. The answers tell you everything.</p><p class=\"zh\">所以我是电影反派，你是有大梦想的派对小喇叭？今天就把这个问题拿去问朋友，答案能说明一切。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>trillionaire</b><span>万亿富翁</span></li><li><b>mood swing</b><span>情绪大起大落；反复无常</span></li><li><b>mic drop moment</b><span>惊艳全场的高光时刻</span></li><li><b>narrative</b><span>主流说法；主导叙事</span></li><li><b>aurora</b><span>极光</span></li><li><b>off the charts</b><span>爆表的；好到离谱</span></li></ul></div>\n    </article>"}];
const PER_PAGE = 10;
let curPage = 1;
const listView = document.getElementById('listView');
const detailView = document.getElementById('detailView');
const zhToggle = document.getElementById('zhToggle');

function showList(page) {
  if (page) curPage = page;
  detailView.style.display = 'none';
  listView.style.display = '';
  zhToggle.style.display = 'none';
  const total = Math.ceil(EPISODES.length / PER_PAGE);
  curPage = Math.min(Math.max(curPage, 1), total);
  const items = EPISODES.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);
  let html = items.map(e => e.row).join('');
  if (total > 1) {
    html += '<div class="pager">'
      + '<button ' + (curPage <= 1 ? 'disabled' : '') + ' onclick="showList(' + (curPage - 1) + ')">← 上一页</button>'
      + '<span>第 ' + curPage + ' / ' + total + ' 页</span>'
      + '<button ' + (curPage >= total ? 'disabled' : '') + ' onclick="showList(' + (curPage + 1) + ')">下一页 →</button>'
      + '</div>';
  }
  listView.innerHTML = html;
  listView.querySelectorAll('.ep-row').forEach(r =>
    r.addEventListener('click', () => showDetail(r.dataset.date)));
  window.scrollTo(0, 0);
}

function showDetail(date) {
  const ep = EPISODES.find(e => e.date === date);
  if (!ep) return;
  listView.style.display = 'none';
  detailView.style.display = '';
  detailView.innerHTML = ep.detail;
  zhToggle.style.display = '';
  window.scrollTo(0, 0);
}

zhToggle.addEventListener('click', () => {
  const hidden = document.body.classList.toggle('hide-zh');
  zhToggle.textContent = hidden ? '显示译文' : '隐藏译文';
});

showList(1);
</script>
