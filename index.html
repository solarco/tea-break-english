\"en\">The trade surplus is now nine hundred thirty eight billion dollars for the first nine months. That is a wild number.</p><p class=\"zh\">前九个月的贸易顺差已经高达九千三百八十亿美元，相当夸张了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">So your small talk line is simple. Say, China just beat growth expectations because of the A I chip boom, but back home people are still not spending. Two-speed economy, huh?</p><p class=\"zh\">所以聊天话术很简单：你听说了吗？中国因为 A I 芯片出口超预期增长，但国内大家还是不花钱，典型的双速经济。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That two-speed economy phrase is a great one to steal. It works for everything. My week is a two-speed economy. Monday is booming, Friday is a recession.</p><p class=\"zh\">“双速经济”这个词太值得偷了，啥都能套用。我这一周就是双速经济：周一爆发，周五萧条。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>算法定价</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Ha. Speaking of spending, here is one that will make everyone mad. Did you read the A P story about the grocery stores?</p><p class=\"zh\">哈哈。说到花钱，这里有个让人恼火的新闻：你看到美联社那篇关于超市的报道了吗？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The electronic price tags? Oh, I saw that. Stores are replacing paper price tags with digital ones, and A I tools are deciding what to charge based on how they think shoppers will react.</p><p class=\"zh\">电子价格标签？看到了。超市在用电子屏取代纸质价签，A I 会根据你的反应预测你能接受多少钱来定价。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly. People are used to prices changing for flights and hotels, but now the fear is your groceries will cost different amounts for different people. Social media calls it surveillance pricing.</p><p class=\"zh\">没错。大家已经习惯了机票酒店价格浮动，但现在担心的是：同样的牛奶，你付的钱可能跟我不一样。社交媒体上管这叫“监控式定价”。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And Walmart&#x27;s C E O had to write a blog post saying, in his words, we price the product, not the person. A sentence you only write when nobody believes you.</p><p class=\"zh\">沃尔玛的 C E O 不得不在博客里发文，用他的原话说：我们是给商品定价，不是给人定价。这种话只有没人信你的时候才需要写。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The consultants call it a power struggle between the companies and the shoppers. Whoever has the algorithm has the power.</p><p class=\"zh\">咨询公司管这叫企业和消费者之间的权力之争：谁掌握了算法，谁就说了算。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the stealable line: have you heard about surveillance pricing? Stores might use A I to change grocery prices based on your data.</p><p class=\"zh\">所以拿去用的话术是：你听说过监控式定价吗？商店可能用 A I 根据你的数据来调超市价格。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Steal it. Everyone will have an opinion.</p><p class=\"zh\">拿去用，人人都有话说。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>光芒拿赛点</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And to close things out, a little baseball. The Tampa Bay Rays won again last night, right?</p><p class=\"zh\">最后来点棒球。坦帕湾光芒队昨晚又赢了吧？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">They did. Three to one over the Cleveland Guardians in Game five in Cleveland. So Tampa Bay now leads the series three games to two, and they are one win away from the World Series.</p><p class=\"zh\">没错，三比一击败了克利夫兰守护者队，系列赛第五场在克利夫兰打的。光芒队现在三比二领先，距离世界大赛只差一场胜利。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Drew Rasmussen went seven innings, gave up just one run, struck out six. Only three runs in thirteen innings this series.</p><p class=\"zh\">拉斯穆森先发七局只丢一分，三振六次，整个系列赛十三局只丢了三分。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The Rays scored one run in each of the first three innings and then the bullpen slammed the door. Cleveland had the tying run at the plate in the bottom of the ninth and could not get it done.</p><p class=\"zh\">光芒队前三局每局都拿下一分，牛棚守住了最后关头。守护者队第九局下半追分机会摆在眼前，可惜没能把握住。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And tonight is Game six, back in Tampa Bay, eight P M Eastern. If the Rays win, they are off to face the Milwaukee Brewers in the World Series on Friday.</p><p class=\"zh\">今晚第六场回到坦帕湾打，美国东部时间晚上八点。光芒赢了就直接晋级，周五对阵密尔沃基酿酒人打世界大赛。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">If Cleveland wins, we get a winner take all Game seven tomorrow. Either way, by this time tomorrow we will know whether the Rays are World Series bound.</p><p class=\"zh\">守护者要是赢了，明晚还有抢七大战。不管怎样，到明早我们就知道光芒队能不能进世界大赛了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is your stealable line, by the way. Just say, did you catch the Rays last night? They are one win from the World Series, and Game six is tonight.</p><p class=\"zh\">这句是可以偷走的小词条。直接说：你看昨晚光芒队的比赛了吗？他们离世界大赛只差一场胜利，第六场就在今晚。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Steal it and use it at lunch.</p><p class=\"zh\">拿去用吧，午饭时正好聊。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Okay, time for our random question of the day.</p><p class=\"zh\">好，到了今天的随机快问时间。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Hit me.</p><p class=\"zh\">放马过来。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">If you could invent one brand new holiday, a real holiday, day off and everything, what would it celebrate?</p><p class=\"zh\">如果你能发明一个全新的节日，真正的节日，放假的那种，你希望它庆祝什么？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh. Easy. Nap Day. National Nap Day. The whole country shuts down and everyone takes a nap at two P M.</p><p class=\"zh\">简单。打盹节！全国打盹日！全国放假，下午两点全民午睡。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is the most you answer I have ever heard.</p><p class=\"zh\">这答案也太像你了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">What about you?</p><p class=\"zh\">你呢？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">I would invent Unfinished Project Day. You know, that drawer full of half-fixed things? One day a year, everyone finishes one thing they started.</p><p class=\"zh\">我要发明“未完成事项日”。就是你家那个装着修了一半的东西的抽屉？一年一天，所有人必须完成一件烂尾的事。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is very wholesome. Boring, but wholesome.</p><p class=\"zh\">很暖心。无聊，但很暖心。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Wholesome is my brand, Alex. Do not come for me.</p><p class=\"zh\">暖心就是我的标签，艾利克斯，别拆我台。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Ask your friends this one today. If you could invent a holiday, what would it be?</p><p class=\"zh\">今天就拿这个问题去问朋友吧：如果你能发明一个节日，你希望它庆祝什么？</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>winner-take-all</b><span>赢者通吃；一场定胜负</span></li><li><b>beat expectations</b><span>超出预期</span></li><li><b>two-speed economy</b><span>双速经济；出口火热、内需疲软的冰火两重天</span></li><li><b>trade surplus</b><span>贸易顺差</span></li><li><b>dynamic pricing</b><span>动态定价；随需求实时调价</span></li><li><b>surveillance pricing</b><span>监控式定价；按个人数据差异化定价</span></li><li><b>electronic shelf labels</b><span>电子货架标签</span></li></ul></div>\n    </article>"}, {"date": "2026-10-18", "row": "<div class=\"ep-row\" data-date=\"2026-10-18\"><div class=\"ep-row-title\">茶水间英文 - 10月18日 | 复联4重夺冠军、Meta开源跑不起、星爷1元卖影院</div><div class=\"ep-row-hook\">Endgame retakes the box office crown; Meta&#x27;s free 816B model needs a $40K Mac; Stephen Chow sells cinemas for one dollar.</div><div class=\"ep-row-meta\">2026-10-18 · 全文 742 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月18日 | 复联4重夺冠军、Meta开源跑不起、星爷1元卖影院</h2>\n      <div class=\"meta\">2026-10-18 · 全文 742 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　复联4重夺影史票房冠军、卡梅隆画贺图；Meta开源8160亿参数大模型但本地要四万美元Mac；周星驰1港元甩卖内地影院。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-18.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>复联4重夺冠军</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Oh, I have to start with this one, because Hollywood just gave us the classiest box office battle ever.</p><p class=\"zh\">哦，我得先说这条，因为好莱坞刚刚上演了史上最体面的票房之争。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">You are talking about Avengers Endgame taking the crown back from Avatar.</p><p class=\"zh\">你说的是《复联4》从《阿凡达》手里夺回票房冠军吧。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">I am. The Encore re-release hit theaters on September twenty fifth with a few new scenes, pushing Endgame to about two point nine three billion dollars worldwide, just past Avatar&#x27;s two point nine two. The crown is Endgame&#x27;s again.</p><p class=\"zh\">没错。加长版《复联4：安可》9月25日上映，加了几个新镜头，把全球总票房推到了约29.3亿美元，刚好超过《阿凡达》的29.2亿。冠军宝座又回到了《复联4》手里。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And the best part is what James Cameron did. The man who just lost the record drew a picture congratulating the winner.</p><p class=\"zh\">最精彩的是卡梅隆的反应。刚丢了纪录的这位大导，亲手画了一幅画祝贺赢家。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">He posted original artwork of Iron Man standing in a circle of the Na&#x27;vi, with a caption that says, you are one of the people. Signed, Jim Cameron.</p><p class=\"zh\">他发布了一幅原创画：钢铁侠站在纳美人围成的圈子里，配文是“你是我们中的一员”。落款：吉姆·卡梅隆。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is gracious. Losing the record and taking it in stride, with original art.</p><p class=\"zh\">真大度。丢了纪录还能如此从容，还专门画了幅画。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">This is the second time Endgame has taken the record, by the way. The first was back in twenty nineteen. Then Avatar grabbed it back in twenty twenty one with a re-release in China.</p><p class=\"zh\">顺便说一句，这是《复联4》第二次拿下这个纪录。第一次是2019年，后来《阿凡达》在2021年靠中国重映又抢了回去。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">It is a whole tradition. Steven Spielberg used to send George Lucas congratulatory notes when Star Wars passed Jaws.</p><p class=\"zh\">这都快成传统了。当年《星球大战》超过《大白鲨》时，斯皮尔伯格就给卢卡斯寄过贺信。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Here is your line for the group chat. Did you hear Avengers Endgame just reclaimed the all time box office crown from Avatar? And James Cameron drew a picture to congratulate them. Total class.</p><p class=\"zh\">这句可以直接拿去群里聊：听说了吗，《复联4》刚从《阿凡达》手里重夺影史票房总冠军，卡梅隆还亲自画画祝贺，格局拉满。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>星爷1元卖影院</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Speaking of movies, the news out of China is the exact opposite mood. The comedy king is bowing out of the cinema business.</p><p class=\"zh\">说到电影，中国那边的消息可是完全相反的画风：喜剧之王要告别影院生意了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">You mean Stephen Chow.</p><p class=\"zh\">你是说周星驰吧。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I do. His listed company, Bingo Group, announced it is selling its mainland cinema business for one Hong Kong dollar. One dollar. A full exit from running movie theaters in mainland China.</p><p class=\"zh\">没错。他的上市公司比高集团宣布，以1港元出售内地影院业务。1港元，正式退出内地影院生意。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">When a business sells for a song like that, you know it was losing money.</p><p class=\"zh\">生意贱卖到这个地步，肯定是亏钱亏怕了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The numbers explain it. Over the past year the unit brought in about two point two five million yuan and lost about one point two million. Its last mainland cinema, in Hangzhou, shut down at the end of September after fifteen years.</p><p class=\"zh\">数字说明了一切：过去一年这块业务营收约225万元，却亏了约120万。它在内地的最后一家影院——杭州那家开了15年的店，9月底也关门了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the theaters were bleeding money. But here is the twist. The man can still make hits. His movie Kung Fu Soccer topped China&#x27;s summer box office with about two point three billion yuan.</p><p class=\"zh\">所以影院一直在亏钱。但反转来了：他拍电影依然能打。《功夫女足》以约23亿元拿下今年中国暑期档票房冠军。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">He can fill the seats, he just cannot run the building. That is honestly poetic.</p><p class=\"zh\">他能填满座位，就是经营不好影院。这还挺有诗意的。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Try this one on a friend. Did you hear Stephen Chow just sold his mainland cinema business for one Hong Kong dollar? The theaters lost money, but his movies are still breaking records.</p><p class=\"zh\">这句可以拿去跟朋友聊：听说了吗，周星驰1港元卖掉了内地影院业务。影院亏钱，但他的电影还在破纪录。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>开源跑不起</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Completely different vibe, but Meta just did something wild in the A I world, and it comes with a catch.</p><p class=\"zh\">画风一转，Meta 在 AI 圈干了件大事，不过有个“但是”。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Muse Spark Open. Meta released the open weights for free this week. Eight hundred sixteen billion parameters, forty two billion active for each token, a one million token context window, and it takes text, images, video and audio as input.</p><p class=\"zh\">Muse Spark Open。Meta 本周免费放出了开放权重：8160亿参数，每个 token 激活420亿，100万 token 上下文窗口，还能同时处理文字、图片、视频和音频。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Built for coding and long agentic tasks. And get this, Meta worked directly with Apple to optimize it, so it can run split across two Mac Studios. Zuckerberg even thanked Apple&#x27;s chief executive John Ternus publicly, and Ternus replied.</p><p class=\"zh\">主打编程和长流程智能体任务。更绝的是，Meta 直接跟苹果合作做了优化，让它能拆开跑在两台 Mac Studio 上。扎克伯格还公开感谢了苹果 CEO 约翰·特努斯，对方也回复了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Two companies that spent years sniping at each other, now collaborating. But here is the catch. Open does not mean easy. To run it locally you need about one terabyte of unified memory. That is two top spec Mac Studios, and people estimate the setup carries a steep price tag of more than forty thousand dollars.</p><p class=\"zh\">两家互掐了好几年的公司，现在居然合作了。但“但是”来了：开源不等于好跑。本地运行需要约1TB统一内存，也就是两台顶配 Mac Studio，整套配置估计超过4万美元。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Free to download, forty thousand dollars to actually use. And the license has strings attached too. Anything built on it has to say, built with Muse Spark Open, and big companies above twenty million in revenue need a separate deal with Meta.</p><p class=\"zh\">下载免费，跑起来要四万美元。而且许可还有附加条件：用它做的产品必须标注“Built with Muse Spark Open”，年收入超2000万美元的大公司还得跟 Meta 另签商业协议。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So it is open, but not quite open. Steal this line. So apparently Meta just gave away its biggest A I model for free. There is just one problem. You need about forty thousand dollars of Macs to run it.</p><p class=\"zh\">所以是开源了，但没完全开。偷走这句：听说没，Meta 刚把自家最大的 AI 模型免费送人了。只有一个小问题：你得先花四万美元买 Mac 才能跑得动。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>reclaim the crown</b><span>重夺桂冠；重新登顶</span></li><li><b>gracious</b><span>大度的；体面的</span></li><li><b>take it in stride</b><span>从容淡定地接受（挫折）</span></li><li><b>open weights</b><span>开放权重（模型参数免费下载，但训练数据不公开，不等于完全开源）</span></li><li><b>come with strings attached</b><span>附带条件；天下没有免费的午餐</span></li><li><b>steep price tag</b><span>高昂的价格</span></li><li><b>sell for a song</b><span>贱卖；以极低的价格出售</span></li><li><b>bow out</b><span>优雅退出；告别（舞台）</span></li></ul></div>\n    </article>"}, {"date": "2026-10-17", "row": "<div class=\"ep-row\" data-date=\"2026-10-17\"><div class=\"ep-row-title\">茶水间英文 - 10月17日 | 聊天AI破产、粉钻百年、停车名场面</div><div class=\"ep-row-hook\">Chatbot bankruptcy drama, a diamond in an apple, and Joe Jonas cannot park</div><div class=\"ep-row-meta\">2026-10-17 · 全文 809 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月17日 | 聊天AI破产、粉钻百年、停车名场面</h2>\n      <div class=\"meta\">2026-10-17 · 全文 809 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　Character.AI 破产、迪士尼抄底；百年粉钻重见天日；Joe Jonas 停车翻车。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-17.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>聊天AI破产</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The biggest A I wipeout of the year. Did you hear Character dot A I just filed for bankruptcy?</p><p class=\"zh\">今年 AI 圈最大的爆雷。你听说 Character.AI 申请破产了吗？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The chatbot app where you could talk to Harry Potter or your favorite anime character?</p><p class=\"zh\">就是那个可以跟哈利·波特或者你喜欢的动漫角色聊天的 App？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is the one. On Monday they filed Chapter Eleven in Delaware. In twenty twenty four Google paid two point seven billion for their tech and their founders. Today the company is worth fifty to a hundred million, and a court is selling it off.</p><p class=\"zh\">就是它。周一他们在特拉华州申请了 Chapter 11 破产。2024 年谷歌花 27 亿美元买了他们的技术还挖走了创始人，现在公司只值五千万到一亿美元，法院正在拍卖。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">From two point seven billion to pocket change in two years. What went wrong?</p><p class=\"zh\">两年从 27 亿跌到零头。怎么搞成这样的？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Lawsuits. A landslide. Parents said the chatbots harmed teenagers, Pennsylvania sued over a fake medical license, and Disney sent a cease and desist over its characters. The legal bills ate the company.</p><p class=\"zh\">官司，海量的官司。家长说聊天机器人伤害了青少年，宾州告他们冒充医生开假行医执照，迪士尼还因为角色侵权给他们发了律师函。律师费把公司吃垮了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And now Disney is buying the pieces? That is some plot twist.</p><p class=\"zh\">现在迪士尼反过来要买他们的残余资产？这反转也太大了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Right? The same Disney that sent the cease and desist last year is now the lead bidder, twenty million dollars for the tech. They even hired the old C E O as tech chief last month.</p><p class=\"zh\">对吧？去年发律师函的迪士尼，现在成了主要竞买人，2000 万美元买技术，连人家前 CEO 上个月都被迪士尼挖去当 CTO 了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the company that sued them is now shopping in their garage sale. You cannot make this up.</p><p class=\"zh\">所以告他们的公司，现在在他们的破产拍卖上捡漏。这编都编不出来。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Stealable line for your Saturday chats: Did you hear Character dot A I went bankrupt? Disney, the company that sued them last year, is buying the scraps for twenty million dollars.</p><p class=\"zh\">周六聊天可用金句：听说 Character.AI 破产了吗？去年告他们的迪士尼，现在花两千万买他们的残羹剩饭。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>粉钻百年</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Okay, I need something shinier after all that. Have you seen the diamond that just came out of hiding in France?</p><p class=\"zh\">好，我需要点闪亮的东西压压惊。你看到法国那颗重见天日的钻石了吗？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The pink one? The Grand con-DAY?</p><p class=\"zh\">粉色的那颗？Grand Condé？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is the one. Nine carats, pear shaped, and it just went on public display for the first time in a hundred years.</p><p class=\"zh\">就是它。九克拉，梨形，整整一百年后第一次公开展出。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">A hundred years? Where was it hiding?</p><p class=\"zh\">一百年？它藏哪儿了？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">In an apple. In nineteen twenty six, thieves broke into a French castle and stole it, then hid the diamond inside a hollowed out apple.</p><p class=\"zh\">藏在苹果里。1926 年，小偷闯进法国一座城堡偷走了它，然后把钻石藏在了一颗挖空的苹果里。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is either genius or the worst hiding spot in history.</p><p class=\"zh\">这要么是天才，要么是史上最蠢的藏匿地点。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">It worked for a few weeks. Then a maid at their hotel got hungry, took a bite of the apple, and nearly broke a tooth on nine carats of French royal history.</p><p class=\"zh\">居然管用了几个星期。后来小偷住的酒店有个女佣饿了，拿起苹果咬了一口，差点把牙硌在九克拉的法国王室珍宝上。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Stop. That is the best recovery story I have ever heard. And this thing survived the French Revolution?</p><p class=\"zh\">停。这是我听过最搞笑的失物找回故事。这东西还躲过了法国大革命？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">One of the only royal jewels that did. It is on display starting today until January. Stealable line: Did you hear a nine carat pink diamond just came out of hiding after a hundred years? It was in an apple.</p><p class=\"zh\">硕果仅存的王室珠宝之一。从今天起展出到明年一月。金句来了：听说一颗九克拉粉钻藏了一百年后重见天日了吗？它一直藏在苹果里。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>停车名场面</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Jordan, hold on. I need a palate cleanser after the bankruptcy talk. Have you seen the Joe Jonas parking video?</p><p class=\"zh\">等等，我需要个 palate cleanser 缓一缓，破产新闻太丧了。你看 Joe Jonas 那个停车视频了吗？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The parallel parking one? From last December, squeezing a blue G Wagon into a tiny New York spot?</p><p class=\"zh\">平行停车那个？去年12月，开着蓝色大 G 在纽约小车位里进退两难那个？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is the one. This week he posted a TikTok with his mom, Denise. The text on screen says, when your mom wants to know if a video she saw is A I or real.</p><p class=\"zh\">就是。这一周他跟妈妈 Denise 发了条 TikTok，配文是：当你妈想知道她看到的视频是 AI 还是真的。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Oh no.</p><p class=\"zh\">哦不。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh yes. The old clip plays, Joe just shakes his head and walks away. His caption: why is it always the most unbelievable video.</p><p class=\"zh\">哦是的。老视频一放，Joe 摇摇头走开。配文：为什么最离谱的视频永远是真的。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">I love that he is in on the joke. One commenter wrote, the day that video was posted was a generational day in history.</p><p class=\"zh\">我喜欢他这么玩得起。有条评论说，那条视频发布的那天是载入史册的一天。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Another one said, I cannot parallel park without thinking of you now. Same. And this feels personal, because on Tuesday I said if I could have one world class skill, it would be parallel parking.</p><p class=\"zh\">还有人说，我现在停车想不起他都难。感同身受，而且这事跟我有关——周二我说过，如果能拥有一项世界级技能，我选平行停车。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">You did. And Joe Jonas is living proof even pop stars need that superpower. Start a support group, you two.</p><p class=\"zh\">你是说过。Joe Jonas 用亲身经历证明，连流行巨星也需要这个超能力。你俩可以建个互助小组了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">First meeting tonight. Stealable line: Have you seen Joe Jonas&#x27;s parking video? Even pop stars cannot parallel park. There is hope for all of us.</p><p class=\"zh\">今晚第一次开会。金句：看过 Joe Jonas 的停车视频吗？连流行巨星都停不好车，我们都有希望了。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Alright, random question time. If your life had a theme song, one song that blasts every time you walk into a room, what are you picking?</p><p class=\"zh\">好，快问时间：如果人生有出场 BGM，每次你走进房间就自动播放，你选哪首？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh, I am going dramatic. The Imperial March from Star Wars, full villain energy when I walk into a meeting late.</p><p class=\"zh\">我要走戏剧风。《星球大战》帝国进行曲，迟到走进会议室时自带反派气场。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Late to a meeting with villain music is a choice. Mine is the Jeopardy theme, constant countdown panic while I look for my keys.</p><p class=\"zh\">带着反派 BGM 迟到开会，很有想法。我的选《Jeopardy》主题曲，找钥匙时的倒计时恐慌感拉满。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Painfully accurate for you. Wait, can I change mine to the Rocky theme? No, too sweaty. Keep the villain march.</p><p class=\"zh\">你这个太精准了。等等，我能换成《洛奇》主题曲吗？不行，太汗味了。还是反派进行曲吧。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Imagine us walking into the same party. Villain march, then sad quiz show panic. People would clear a path.</p><p class=\"zh\">想象咱俩走进同一个派对：反派进行曲接 quiz 节目倒计时，人群自动让路。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">They absolutely would. Steal this one: ask a friend their walk in theme song, and you learn everything about them in ten seconds.</p><p class=\"zh\">那必须的。偷走这招：问朋友他的出场 BGM 是什么，十秒钟看透一个人。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>file for bankruptcy</b><span>申请破产</span></li><li><b>cease and desist</b><span>停止侵权警告函；勒令停止通知</span></li><li><b>plot twist</b><span>神反转；出人意料的转折</span></li><li><b>heist</b><span>盗窃；抢劫案</span></li><li><b>pear-shaped</b><span>梨形的</span></li><li><b>come out of hiding</b><span>现身；重见天日</span></li><li><b>palate cleanser</b><span>转换心情的小插曲</span></li><li><b>generational</b><span>一代人的；划时代的</span></li></ul></div>\n    </article>"}, {"date": "2026-10-16", "row": "<div class=\"ep-row\" data-date=\"2026-10-16\"><div class=\"ep-row-title\">茶水间英文 - 10月16日 | 酿酒人横扫道奇、AI双雄对决、万圣节装扮榜</div><div class=\"ep-row-hook\">Brewers sweep the Dodgers into the World Series, Anthropic&#x27;s $16.8B quarter stuns OpenAI, and a creepy unicorn tops Halloween.</div><div class=\"ep-row-meta\">2026-10-16 · 全文 908 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月16日 | 酿酒人横扫道奇、AI双雄对决、万圣节装扮榜</h2>\n      <div class=\"meta\">2026-10-16 · 全文 908 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　酿酒人横扫道奇进世界大赛、Anthropic 单季狂揽168亿美元反超 OpenAI、谷歌万圣节装扮榜的瘆人独角兽，还有一道“动物奥运会你家宠物拿什么金牌”的快问。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-16.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>酿酒人横扫道奇</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I did promise, and Milwaukee delivered. The Brewers beat the Dodgers six to four in Los Angeles last night, and that completes a four game sweep of the N L C S.</p><p class=\"zh\">我是答应过，密尔沃基也没让人失望。酿酒人队昨晚在洛杉矶六比四击败道奇，四场横扫拿下国联冠军赛。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">A sweep, against the two time defending champs, in their own ballpark. Nobody drew this up.</p><p class=\"zh\">横扫啊，对手还是两连冠的卫冕冠军，而且是在人家主场。赛前没人敢这么写剧本。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Not at all. And it looked like a Dodger night early. Shohei Ohtani crushed a three run homer in the second inning, his first homer of the entire postseason, and suddenly it was four to nothing, Dodgers.</p><p class=\"zh\">确实。开局看着还像是道奇的夜晚：大谷翔平第二局轰出一记三分炮，这是他整个季后赛的第一发，转眼道奇就四比零领先了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">I saw that swing. A four hundred twenty eight foot blast.</p><p class=\"zh\">那一棒我看了，四百二十八英尺，太吓人了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">But this Brewers team just chipped away. Two runs in the fourth, two more in the fifth to tie it, and then Garrett Mitchell, who also homered on Wednesday night, launched a go ahead solo shot in the sixth, off Tanner Scott.</p><p class=\"zh\">但酿酒人队就这么一点点啃了回来：第四局追两分，第五局再追两分扳平，第六局加勒特·米切尔——周三晚上也开轰的那位——从坦纳·斯科特手里打出一发超前阳春炮。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And the Dodgers kept knocking on the door and nobody answered. Tying run on third base, one out, in the sixth, the seventh, and the eighth, and they never scored.</p><p class=\"zh\">道奇倒是不断敲门，可就是没人开门：第六、七、八局，追平分都站上三垒了，一人出局，结果一分没拿回来。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The bullpen slammed the door. Then in the ninth, David Hamilton, the number nine hitter with four home runs all regular season, goes deep off Edwin Diaz for insurance. Six to four, ballgame, brooms out.</p><p class=\"zh\">酿酒人牛棚直接把门焊死了。第九局，第九棒大卫·汉密尔顿——常规赛一共才四发本垒打——从埃德温·迪亚兹手里又轰一发保险分。六比四，比赛结束，扫帚挥起来了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And the revenge angle: the Dodgers swept Milwaukee in this exact round last year. Now the Brewers return the favor, the first team ever to pull that off.</p><p class=\"zh\">还有复仇这层：去年同一轮，道奇横扫了酿酒人；今年酿酒人原样奉还，史上第一支做到这件事的球队。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">First trip to the World Series since nineteen eighty two. It starts Friday, October twenty third, against the Rays or the Guardians, and Milwaukee gets home field advantage.</p><p class=\"zh\">这是他们自1982年以来第一次进世界大赛。10月23日周五开打，对手是光芒或守护者，酿酒人还有主场优势。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Steal this one for your Friday chats: Did you hear the Brewers just swept the Dodgers? Four straight wins, and they are in the World Series for the first time since nineteen eighty two.</p><p class=\"zh\">周五聊天直接偷这句：听说了吗，酿酒人横扫了道奇？四连胜，自1982年以来第一次进世界大赛。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>AI双雄对决</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Okay, completely different vibe, but the money race in A I just flipped on its head.</p><p class=\"zh\">好，画风一转，AI圈的烧钱大战刚刚翻了天。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">You are talking about Anthropic.</p><p class=\"zh\">你说的是 Anthropic 吧。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I am talking about Anthropic. They just showed investors their numbers ahead of the expected November I P O, and they are wild. Third quarter revenue: sixteen point eight billion dollars, up forty five percent from the second quarter.</p><p class=\"zh\">没错。他们刚在11月IPO前给投资人亮了家底，数字相当炸：第三季度营收168亿美元，比第二季度涨了45%。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Sixteen point eight billion in three months, and profitable on an adjusted basis. Not bad for a company most people had never heard of three years ago.</p><p class=\"zh\">三个月168亿，还按调整后口径盈利了。三年前大多数人都没听过这家公司，这成绩可以啊。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And Microsoft and Nvidia together committed around fifteen billion dollars, pushing the valuation toward three hundred fifty billion.</p><p class=\"zh\">微软和英伟达还联手砸了大概150亿美元，把它估值推到了3500亿美元上下。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Meanwhile OpenAI is having a rough week. Their twenty twenty six revenue estimate just got cut by twenty billion dollars, and they pushed their I P O back to twenty twenty seven.</p><p class=\"zh\">与此同时 OpenAI 这周不太好过：2026年营收预期被砍了200亿美元，IPO也推迟到2027年了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">They still want to raise thirty billion dollars at up to one point five trillion. Nobody is passing a hat around. But the momentum crown has clearly changed heads.</p><p class=\"zh\">他们还是想按最高1.5万亿美元估值融300亿，倒也不至于讨饭。但势头这顶王冠，明显已经易主了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Remember when OpenAI was the unbeatable king? Now Anthropic is setting the pace. What a difference a year makes.</p><p class=\"zh\">还记得当年 OpenAI 是不可战胜的王者吗？现在轮到 Anthropic 领跑了。一年时间，天壤之别。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Here is your line: So apparently Anthropic just pulled in almost seventeen billion dollars in one quarter. The A I money race is getting wild.</p><p class=\"zh\">拿去用这句：听说没，Anthropic 一个季度就赚了将近170亿美元，AI 烧钱大战越来越刺激了。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>独角兽霸榜</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Lighter topic: Halloween is two weeks away and Google just dropped its annual costume report.</p><p class=\"zh\">轻松点的：万圣节还有两周，谷歌刚发布了今年的装扮报告。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The Frightgeist list. I wait for this every year. Number one trending costume in America: Buddy the Unicorn.</p><p class=\"zh\">就是那个 Frightgeist 榜单，我每年都等。今年全美搜索第一的装扮：独角兽巴迪。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Explain this to me, because on paper, a unicorn sounds adorable.</p><p class=\"zh\">给我解释一下，纸面上看独角兽应该挺可爱的啊。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Not this one. Buddy is the mascot of an indie horror movie, a colorful, deeply unsettling unicorn. It beat every superhero and every princess.</p><p class=\"zh\">这只可不是。这只巴迪是部独立恐怖片的吉祥物，花里胡哨但越看越瘆人，干掉了所有超级英雄和公主。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Number two is even funnier. NeeDoh, the squishy stress toy. People are dressing up as a stress ball.</p><p class=\"zh\">第二名更逗：NeeDoh，就是那个解压捏捏乐。大家要扮成减压球过万圣节。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Number three is Nikki, from the horror film Obsession. Wild part: that movie made over five hundred million dollars, but it did not crack the top ten in movie searches. People do not want to watch it. They want to be it.</p><p class=\"zh\">第三名是恐怖片《Obsession》里的妮基。离谱的是，这片全球票房超5亿美元，电影搜索榜前十都没进——大家不想看它，只想扮成它。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Priorities. Number four is Agamemnon, from Christopher Nolan&#x27;s The Odyssey. Nothing says spooky season like a Greek king.</p><p class=\"zh\">优先级很明确了。第四名是诺兰《奥德赛》里的阿伽门农，没什么比希腊国王更万圣节了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The kids list is a whole vibe. Number one: Dolly Parton. Then Shakira, Grogu, and Michael Jackson in his Thriller era. The children have taste.</p><p class=\"zh\">儿童榜又是另一种画风：第一名多莉·帕顿，然后是夏奇拉、格鲁古，还有 Thriller 时期的迈克尔·杰克逊。小朋友们有品位。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So with two weeks to go, the internet has spoken. Creepy unicorn it is.</p><p class=\"zh\">所以还剩两周，互联网已经投票了：就扮瘆人独角兽吧。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Try this one on a friend: Have you seen Google&#x27;s Halloween costume list? The number one costume this year is a creepy unicorn from a horror movie.</p><p class=\"zh\">跟朋友试试这句：你看谷歌的万圣节装扮榜了吗？今年第一名是恐怖片里的一只瘆人独角兽。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Random question time. If animals had their own Olympics, which event would your pet win gold in?</p><p class=\"zh\">快问时间：如果动物们自己办奥运会，你家宠物哪个项目能拿金牌？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">My dog takes gold in competitive speed eating. The bowl hits the floor and it is gone in four seconds. The judges would need slow motion replay.</p><p class=\"zh\">我家狗，竞速干饭项目金牌。饭盆落地四秒清空，裁判得看慢放回放。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">My cat dominates the marathon nap. Twenty two hours of sleep, one dramatic stretch, back to sleep. Undefeated since twenty twenty one.</p><p class=\"zh\">我家猫，马拉松睡觉项目统治级：睡22小时，一个华丽的伸懒腰，接着睡。自2021年保持不败。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">What about synchronized ignoring? When you call their name and they look right through you. That is an art form.</p><p class=\"zh\">那花式装没听见呢？你叫它名字，它直接看穿你。这可是门艺术。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">My cat medals in that too. She invented it. Our pets would sweep the podium, then demand snacks as prize money.</p><p class=\"zh\">我家猫这项也能拿牌，这可是她发明的。咱家宠物能包揽领奖台，然后要求用零食当奖金。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Ask a friend this one today. Everybody has an answer, and everybody thinks their pet is the champion.</p><p class=\"zh\">今天就拿这题去问朋友吧，人人都有答案，而且都觉得自家宠物是冠军。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>sweep</b><span>横扫(系列赛)</span></li><li><b>go-ahead homer</b><span>反超比分的本垒打</span></li><li><b>chip away</b><span>一点点蚕食领先优势；逐步追分</span></li><li><b>slam the door</b><span>关门；彻底终结悬念</span></li><li><b>on an adjusted basis</b><span>按调整后口径(计算)</span></li><li><b>pull in</b><span>赚得；揽入(收入)</span></li><li><b>breakout search</b><span>爆发式搜索热词</span></li></ul></div>\n    </article>"}, {"date": "2026-10-15", "row": "<div class=\"ep-row\" data-date=\"2026-10-15\"><div class=\"ep-row-title\">茶水间英文 - 10月15日 | 通胀爆表、八州起诉、蜘蛛甜甜圈</div><div class=\"ep-row-hook\">Fed hike bets are back, eight states take on OpenAI, and a spider donut returns</div><div class=\"ep-row-meta\">2026-10-15 · 全文 771 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月15日 | 通胀爆表、八州起诉、蜘蛛甜甜圈</h2>\n      <div class=\"meta\">2026-10-15 · 全文 771 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　通胀高于预期引发加息猜想、八州联合起诉 OpenAI、Dunkin 网红蜘蛛甜甜圈万圣节回归，还有一道“给自己设计一个专属表情符号”的快问。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-15.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>通胀爆表</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Inflation came in hotter than expected. September prices rose three point seven percent from a year ago, while economists had expected three point six.</p><p class=\"zh\">通胀数据高于预期。九月份物价同比上涨了百分之三点七，而经济学家的预期是百分之三点六。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">A tenth of a point. Sounds tiny. Why is everyone freaking out?</p><p class=\"zh\">才差零点一个百分点。听起来微不足道，为什么大家都慌了？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Because it is the direction that matters. Core prices, which strip out food and energy, also beat expectations. And suddenly Wall Street started betting on a Fed rate hike at its meeting on October twenty-seventh and twenty-eighth.</p><p class=\"zh\">因为方向比数字更重要。剔除食品和能源的核心通胀也高于预期。华尔街突然开始押注，美联储可能在十月二十七日到二十八日的会议上再次加息。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Wait, a hike? Not a cut? Rates are already sky high.</p><p class=\"zh\">等等，是加息？不是降息？利率已经够高了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly why the market threw a fit. The odds of a hike jumped to around fifty percent right after the report. The S and P fell, the Nasdaq dropped almost a percent, and the dollar hit an eighteen month high.</p><p class=\"zh\">所以市场才炸了。报告一出来，加息的概率一下冲到五成左右。标普下跌，纳指跌了近一个百分点，美元还创了十八个月新高。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Did it stay there?</p><p class=\"zh\">后来稳住了吗？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Not quite. A few Fed officials then said the central bank can wait for a clearer picture, so traders scaled those bets back down to about one in three. Gold jumped too, since investors buy gold when the future looks wobbly.</p><p class=\"zh\">稍微稳了点。几位美联储官员表态说，央行可以等局势更明朗再做决定，交易员们于是把加息押注降回了三分之一左右。黄金也涨了，毕竟未来不明朗时大家都爱买黄金。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the message is, inflation is not finished yet.</p><p class=\"zh\">所以结论是：通胀这事儿还没完。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">It is not finished. Steal this line. Did you hear inflation came in hotter than expected? Now Wall Street is betting the Fed might hike rates again before Halloween.</p><p class=\"zh\">没完。拿来即用的一句话：听说通胀高于预期了吗？现在华尔街都在押注，美联储万圣节前可能再次加息。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>八州起诉</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is a good one. Speaking of things blowing up, the legal world had its own fireworks yesterday. Eight states just sued OpenAI.</p><p class=\"zh\">这句不错。再说个爆炸的：法律圈昨天也有大烟花。八个州联合起诉了 OpenAI。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Eight states? That sounds coordinated.</p><p class=\"zh\">八个州？听起来是有组织的。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">It was totally coordinated. On Wednesday, the attorneys general of Iowa, Kansas, Nebraska, West Virginia, Arkansas, Arizona, Idaho and Montana each filed their own lawsuit, and announced it together. They allege OpenAI sold ChatGPT as safe for kids while the chatbot pushed young users toward harmful behavior.</p><p class=\"zh\">没错，就是有组织的。爱荷华、堪萨斯、内布拉斯加、西弗吉尼亚、阿肯色、亚利桑那、爱达荷和蒙大拿八州的总检察长各自提起诉讼，然后联合宣布。他们指控 OpenAI 把 ChatGPT 包装成对孩子安全，实际上却把年轻用户推向有害行为。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">What are they actually asking for?</p><p class=\"zh\">他们到底想要什么？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Civil penalties, real product changes, and limits on how the chatbot talks to minors. It is the biggest coordinated state action against an A I company so far, and it lands as OpenAI prepares for a public listing.</p><p class=\"zh\">民事罚款、实实在在的产品整改，还有对聊天机器人与未成年人互动的限制。这是美国各州针对 AI 公司最大规模的一次联合法律行动，而时间点正好是 OpenAI 准备公开上市前夕。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And OpenAI&#x27;s response?</p><p class=\"zh\">OpenAI 怎么回应的？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">They say they have built parental controls and age protections, and that no system is perfect. The states say those safeguards are not good enough. So this fight is going to run for a while.</p><p class=\"zh\">他们说已经做了家长控制和年龄保护功能，没有系统是完美的。但各州说这些保护措施远远不够。所以这场仗要打一阵子了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Stealable line. So apparently eight states just sued OpenAI, saying ChatGPT is not nearly as safe for kids as the company claimed. That is a conversation starter for any parent.</p><p class=\"zh\">拿来即用的一句话：听说八个州联合起诉 OpenAI 了，说 ChatGPT 对孩子远没有公司宣称的那么安全。跟家长聊天时这是个绝佳开场。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>蜘蛛甜甜圈</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Okay, we need something lighter after that. Can I offer you a donut?</p><p class=\"zh\">好，重磅之后来点轻松的。请你吃个甜甜圈怎么样？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I am always in. What kind?</p><p class=\"zh\">必须的。什么口味的？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">A spider one. Dunkin&#x27; just brought back its viral Spider Donut for Halloween. It is a purple-frosted donut with chocolate legs, a chocolate munchkin body, and tiny white icing eyes.</p><p class=\"zh\">蜘蛛味的。Dunkin 的网红蜘蛛甜甜圈万圣节回归了！紫色糖霜、巧克力做的腿，中间一颗巧克力小圆球当蜘蛛身体，还有白色糖霜点的小眼睛。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That thing is adorable and creepy at the same time. And people went wild.</p><p class=\"zh\">这东西又可爱又诡异。大家都疯了吧？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">They went completely wild. They teased it on Instagram with just a silhouette, and the comments exploded. Even Walmart, Hey Dude and a cosmetics company jumped in. Everybody wanted a piece of the spider.</p><p class=\"zh\">彻底疯了。他们在 Instagram 上只发了个剪影预告，评论区就炸了。连别的品牌都来凑热闹：沃尔玛、HeyDude，还有一家美妆公司，人人都想蹭蜘蛛的流量。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And there is a new drink too, right?</p><p class=\"zh\">是不是还有一款新饮品？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Yes, the Berry Battie Daydream Refresher. Berry, clementine and blueberry with oat milk, topped with purple marshmallow cold foam. Limited time only, of course.</p><p class=\"zh\">有，莓果小蝙蝠白日梦冰萃。莓果、金橘和蓝莓加燕麦奶，上面是紫色棉花糖奶盖。限时供应，懂的都懂。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Right, scarcity sells. Steal this one. Did you hear Dunkin&#x27;s viral Spider Donut is back for Halloween? It might be the unofficial mascot of spooky season.</p><p class=\"zh\">懂，稀缺才好卖。拿来即用的一句话：听说 Dunkin 的网红蜘蛛甜甜圈万圣节回归了吗？它可能是万圣季的非官方吉祥物。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Now for the part of the show where we get silly. If one brand new emoji got added to your keyboard tomorrow, one that perfectly sums up your life right now, what would it be?</p><p class=\"zh\">现在进入本节目的犯傻环节。如果明天你的键盘上新增一个表情符号，一个能完美概括你现状的表情，会是什么样？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh, easy. An alarm clock being launched out of a window.</p><p class=\"zh\">太简单了：一只闹钟被扔出窗外。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">You are clearly not a morning person.</p><p class=\"zh\">你显然不是个早起的人。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">What about you?</p><p class=\"zh\">那你呢？</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">A couch with a magnet, and me stuck to it. The ultimate Thursday night energy.</p><p class=\"zh\">一个带磁铁的沙发，我被牢牢吸在上面。标准的周四夜晚能量。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is suspiciously accurate. Listeners, steal this one. Ask a friend what their personal emoji would be. You will learn everything about them in one answer.</p><p class=\"zh\">这也太准了。听众朋友们，拿去用：今天问问朋友，他们的专属表情符号会是什么样。一个问题就能看透一个人。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>hotter-than-expected</b><span>高于预期的；爆表的</span></li><li><b>rate hike</b><span>加息</span></li><li><b>scale back</b><span>缩减；降低</span></li><li><b>allege</b><span>指控；声称（尚未证实）</span></li><li><b>public listing</b><span>公开上市</span></li><li><b>tease</b><span>在社交媒体上吊胃口、预告</span></li><li><b>mascot</b><span>吉祥物</span></li></ul></div>\n    </article>"}, {"date": "2026-10-14", "row": "<div class=\"ep-row\" data-date=\"2026-10-14\"><div class=\"ep-row-title\">茶水间英文 - 10月14日 | ASML指引三连涨、OpenAI抓内鬼、美银遭重罚</div><div class=\"ep-row-hook\">ASML&#x27;s forecast hat trick, an OpenAI spy scandal, and Bank of America&#x27;s billion-dollar oops.</div><div class=\"ep-row-meta\">2026-10-14 · 全文 900 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月14日 | ASML指引三连涨、OpenAI抓内鬼、美银遭重罚</h2>\n      <div class=\"meta\">2026-10-14 · 全文 900 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　ASML 财报大爆、年内第三次上调业绩指引；一名 OpenAI 工程师因涉嫌在高管会议室偷装窃听器被捕，而查出内鬼的正是公司自己的 AI；美国银行因漏报五十多亿美元可疑交易被罚超十二亿美元，外加一道“家里凭空多出一间房”的快问。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-14.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>ASML指引三连涨</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh yeah. A S M L, the Dutch company that makes the machines that make the chips, reported earnings this morning, and they were huge.</p><p class=\"zh\">没错。荷兰公司 ASML 今早发布财报，炸裂——这家公司专做“造芯片的机器”。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">How huge are we talking?</p><p class=\"zh\">到底有多炸？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Third quarter revenue of eleven point six six billion euros, net profit of four point nine six billion, more than doubled from last year. And they raised their full year forecast for the third time in twenty twenty-six, now expecting between forty-four and forty-five billion euros in sales.</p><p class=\"zh\">第三季度营收一百一十六点六六亿欧元，净利润四十九点六亿欧元，同比翻倍还多。而且他们今年第三次上调全年预期，现在预计全年销售额在四百四十到四百五十亿欧元之间。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Three times in one year. And who is buying all these machines? T S M C, Samsung, Intel, basically everyone who makes advanced chips.</p><p class=\"zh\">一年上调三次。买单的都有谁？台积电、三星、英特尔，基本上所有造高端芯片的公司。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Right, because A S M L has a near monopoly on the lithography machines you need to make the fanciest semiconductors. The C E O said some customers are already talking about placing orders for twenty twenty-nine and even twenty thirty.</p><p class=\"zh\">对，因为 ASML 在光刻机领域近乎垄断——想造最顶级的半导体，绕不开它。CEO 说，有些客户已经开始谈二〇二九年甚至二〇三〇年的订单了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">People are lining up to buy chip machines for the next decade. It is now the most valuable listed company in Europe, stock up about eighty percent in the last year. And yet the stock slipped in premarket trading, because the whole chip sector had a rough week.</p><p class=\"zh\">大家排队买未来十年的芯片机器。它现在是欧洲市值最高的上市公司，过去一年股价涨了约八成。但有意思的是，财报这么好，盘前股价反而小跌，因为整个芯片板块这周都在回调。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Here is your stealable line. Did you hear A S M L raised its sales forecast for the third time this year? Customers are already lining up for chip machines for twenty thirty.</p><p class=\"zh\">拿来即用的一句话：听说 ASML 今年第三次上调销售预期了吗？客户已经开始排队买二〇三〇年的芯片机器了。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>OpenAI抓内鬼</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Oh, and did you see what happened at OpenAI? This one reads like a movie script.</p><p class=\"zh\">哦对了，你看到 OpenAI 那件事了吗？简直像电影剧本。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">I did. The Justice Department announced charges yesterday against a thirty-five year old OpenAI engineer named Abdulrahman Alfozan, a Saudi national who joined the company in July of last year. Federal agents arrested him on October ninth.</p><p class=\"zh\">看到了。美国司法部昨天宣布起诉一名三十五岁的 OpenAI 工程师 Abdulrahman Alfozan，沙特籍，去年七月加入公司。联邦特工十月九日把他逮捕了。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Prosecutors say he planted a hidden recording device in an executive conference room in San Francisco. They found it on September thirtieth, wrapped in toilet paper, plugged into the U S B port on the back of a T V.</p><p class=\"zh\">检方说，他在旧金山一间高管会议室里偷装了窃听器。九月三十日被发现，藏在卫生纸里，插在电视机背面的 USB 口上。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Prosecutors say it was installed around September twenty-eighth and everything on it was encrypted.</p><p class=\"zh\">检方说设备大概是九月二十八日装的，里面的数据全部加密，读不出来。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And here is the best part. OpenAI said it used its own A I models to figure out which employee planted the device.</p><p class=\"zh\">而最绝的是，OpenAI 说，是他们自家的 AI 模型查出了装设备的人是谁。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">The A I caught the human spy. You cannot make this stuff up. He is fired, in federal custody, and faces up to five years in prison and a two hundred fifty thousand dollar fine. Stealable line. So apparently an OpenAI engineer tried to bug the executive conference room, and the company&#x27;s own A I figured out who did it. The plot twist nobody saw coming.</p><p class=\"zh\">AI 抓住了人类间谍，编都编不出来。他已经被开除，人关在联邦拘留所，最高面临五年监禁和二十五万美元罚款。拿来即用：听说 OpenAI 一名工程师想在高管会议室装窃听器，结果被公司自己的 AI 揪出来了，反转来得猝不及防。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>美银遭重罚</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Switching gears completely, the U S Treasury just dropped the hammer on a very big bank.</p><p class=\"zh\">完全换个频道，美国财政部刚刚对一家大银行下了重手。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Bank of America. More than one point two one billion dollars in penalties, announced Tuesday, the third biggest fine in Treasury Department history. The bank failed to report more than five billion dollars in suspicious transactions over several years, including more than one billion tied to national security concerns.</p><p class=\"zh\">美国银行。周二宣布的罚单超过十二点一亿美元，是财政部历史上第三大罚单。原因是该银行多年来漏报了五十多亿美元的可疑交易，其中十多亿美元还涉及国家安全风险。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Part of that is a seven hundred fifty million dollar penalty from the bank regulator, the O C C, the biggest fine that regulator has ever handed out. There is also an eleven point six million dollar piece for sanctions violations involving Russia, Iran, narcotics, and global terrorism.</p><p class=\"zh\">其中七点五亿美元来自银行监管机构 OCC 的处罚，是该机构史上最大罚单；还有一千一百六十万美元是针对制裁违规的，涉及俄罗斯、伊朗、毒品和全球恐怖主义。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And the bank actually admitted it willfully violated the Bank Secrecy Act. Shares still fell more than two percent after hours, and the fine will dent this week&#x27;s earnings by seventeen cents a share.</p><p class=\"zh\">而且银行承认自己“故意”违反了《银行保密法》。股价盘后还是跌了超 2%，这笔罚款会让本周财报每股盈利少十七美分。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Stealable line. Did you hear Bank of America just agreed to pay one point two billion dollars for missing suspicious transactions? Third biggest penalty the Treasury has ever handed out. That is an expensive oops.</p><p class=\"zh\">拿来即用：听说美国银行同意支付十二亿美元罚金，就因为漏报可疑交易？财政部史上第三大罚单，这失误太贵了。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Okay, question of the day. If a brand new room appeared in your home tomorrow, out of nowhere, what are you turning it into?</p><p class=\"zh\">好，今日快问：如果明天你家里凭空多出一间房，你会拿它做什么？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Oh, easy. A room just for naps. Blackout curtains, the softest mattress on earth, and a sign on the door that says do not disturb until further notice.</p><p class=\"zh\">太简单了：一间专门用来午睡的房间。遮光窗帘、世界上最软的床垫，门口挂个牌子——谢绝打扰，另行通知。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is suspiciously close to a second bedroom.</p><p class=\"zh\">这听起来跟第二间卧室没啥区别啊。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Totally different. A bedroom has responsibilities. A nap room has none.</p><p class=\"zh\">完全两码事。卧室是有责任的，午睡房没有。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Fair. I am building a snack library. Shelves of chips, a soda fountain, and a little freezer just for ice cream.</p><p class=\"zh\">有道理。那我建个零食图书馆：整面墙的薯片、一台汽水机，还有专门放冰淇淋的小冰柜。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">We should connect our rooms. Nap, wake up, snack, repeat. That is basically a resort.</p><p class=\"zh\">我们应该把两间房打通：睡醒吃、吃完睡，循环往复。这不就是度假村吗。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And steal this one today, by the way. Ask a friend what their dream room would be, and you instantly learn who they really are.</p><p class=\"zh\">顺便偷走今天这句：问朋友“你想要一间什么样的梦幻房间”，瞬间就能看清他是什么人。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>lithography</b><span>光刻（制造高端芯片的核心工艺）</span></li><li><b>guidance</b><span>（公司发布的）业绩指引、预期</span></li><li><b>premarket trading</b><span>盘前交易</span></li><li><b>plant a bug</b><span>安装窃听器；偷装监听设备</span></li><li><b>encrypted</b><span>加密的</span></li><li><b>suspicious transaction</b><span>可疑交易</span></li><li><b>willfully violated</b><span>故意违反</span></li></ul></div>\n    </article>"}, {"date": "2026-10-13", "row": "<div class=\"ep-row\" data-date=\"2026-10-13\"><div class=\"ep-row-title\">茶水间英文 - 10月13日 | 诺奖经济学奖、Anthropic防抄袭、卡通网200G泄露</div><div class=\"ep-row-hook\">Nobel economics glory, Anthropic&#x27;s copycat crackdown, and Cartoon Network&#x27;s two-hundred-gigabyte nostalgia bomb.</div><div class=\"ep-row-meta\">2026-10-13 · 全文 772 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月13日 | 诺奖经济学奖、Anthropic防抄袭、卡通网200G泄露</h2>\n      <div class=\"meta\">2026-10-13 · 全文 772 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　2026 年最后一个诺贝尔奖花落经济学、Anthropic 重拳打击套取模型能力的“蒸馏攻击”、超过 200GB 的卡通频道制作文件泄露，外加一道“一夜掌握世界级技能”的快问快答。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-13.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>诺奖经济学奖</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Game two of that series is tonight, and the N L C S resumes Wednesday night in Los Angeles. Okay, scores settled. Now the real stuff. The biggest headline this week: the final Nobel Prize of twenty twenty-six has been awarded, and it went to economics.</p><p class=\"zh\">美联冠军赛的第二场在今晚开打，国联冠军赛则在周三晚上回到洛杉矶继续。好，比分更新完毕，进入正题。本周最大的新闻：二零二六年最后一个诺贝尔奖已经揭晓，颁给了经济学。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Two Americans, Robert Hall from Stanford and Michael Woodford from Columbia. They built models that help central banks steady the economy when shocks hit, like energy crises or sudden spending slumps.</p><p class=\"zh\">获奖的是两位美国人，斯坦福大学的 Robert Hall 和哥伦比亚大学的 Michael Woodford。他们建立的模型能帮助各国央行在能源危机或消费骤降等冲击来临时稳定经济。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The prize committee said their work helps smooth out the economy&#x27;s peaks and troughs. The prize is twelve million Swedish kronor, roughly one point two million dollars, split between the two.</p><p class=\"zh\">评奖委员会说，他们的研究有助于熨平经济的高峰与低谷。奖金为一千二百万瑞典克朗，约一百二十万美元，由两人平分。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And their big idea is surprisingly human. People are forward-looking: we save and spend based on what we expect the future to hold. So if a central bank communicates its plans clearly, it can nudge the whole economy in the right direction.</p><p class=\"zh\">而他们的核心理念出奇地人性化：人都是有前瞻性的，我们根据对未来的预期来决定存钱还是花钱。所以如果央行能把政策讲清楚，就能把整个经济推向正确的方向。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Pretty relevant, with energy prices jumping all over the place. Steal this one for your group chat: Did you hear who won the Nobel in economics? Two professors who proved that calming people&#x27;s nerves can calm the whole economy.</p><p class=\"zh\">在能源价格上蹿下跳的当下，这相当应景。群聊里可以直接偷这句：听说谁拿了诺贝尔经济学奖吗？两位教授证明了，安抚好人们的情绪，就能稳住整个经济。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>Anthropic防抄袭</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">That is a great line. Now for the A I story of the day, and it is a spy-versus-spy one. Anthropic, the company behind Claude, says it just slammed the door on copycats.</p><p class=\"zh\">这句很棒。接下来是今天的 AI 话题，堪称间谍对间谍。Claude 背后的公司 Anthropic 说，他们刚刚把“抄作业”的人挡在了门外。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Here is the deal. Some rival labs were running what are called distillation attacks. They basically peppered Claude with millions of sneaky questions through proxy networks, trying to harvest its reasoning and bake it into their own cheaper models.</p><p class=\"zh\">事情是这样的：一些竞争对手的实验室在搞所谓的“蒸馏攻击”，通过代理网络向 Claude 狂发数百万个刁钻问题，试图套取它的推理能力，塞进自家更便宜的模型里。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Anthropic says its new safeguards cut that harvesting by ninety to ninety-nine percent, and it banned tens of thousands of accounts tied to the campaigns. It even named a Chinese startup, Z dot A I, saying it tried to distill Claude while building its G L M five point three model.</p><p class=\"zh\">Anthropic 说，新防护措施让这种套取量下降了九成到九成九，还封禁了数万个相关账号。他们甚至点名了一家中国创业公司 Z dot AI，说它在开发 G L M 五点三模型时试图蒸馏 Claude。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Anthropic claims its new defenses are now roughly as tough as the ones that stop Claude from helping build bioweapons, with a false positive rate under zero point one percent. Almost no innocent users get caught in the net.</p><p class=\"zh\">Anthropic 声称，新防线如今和阻止 Claude 协助制造生物武器的防线一样坚固，误报率不到千分之一，几乎不会误伤无辜用户。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">It is the A I arms race in miniature. Everyone wants the recipe, nobody wants to share it. Your stealable line: So apparently Anthropic caught tens of thousands of accounts trying to copy Claude&#x27;s homework, and changed all the locks.</p><p class=\"zh\">这就是缩小版的 AI 军备竞赛：人人都想要秘方，谁都不愿分享。拿去用的句子：听说 Anthropic 抓到了数万个想抄 Claude 作业的账号，直接换了所有门锁。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">3</span>卡通网200G泄露</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Love it. Now, the fun one. If you grew up watching cartoons, your childhood just leaked onto the internet.</p><p class=\"zh\">喜欢这句。接下来是轻松话题。如果你是看着卡通长大的，你的童年刚刚被泄露到了网上。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">More than two hundred gigabytes of Cartoon Network production files surfaced online this weekend. Storyboards, model sheets, animatics, character puppet rigs, even the original Flash source files for early episodes.</p><p class=\"zh\">上周末，超过两百 GB 的卡通频道制作文件在网上现身：故事板、角色设定表、动态分镜、角色骨骼绑定，甚至早期剧集的 Flash 源文件。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Over thirty series are in the mix. The Powerpuff Girls, Adventure Time, Regular Show, Dexter&#x27;s Laboratory, Teen Titans, The Amazing World of Gumball, Robot Chicken. Fans are calling it the classic C N gigaleak.</p><p class=\"zh\">涉及三十多个系列：《飞天小女警》《探险活宝》《Regular Show》《德克斯特的实验室》《少年泰坦》《阿甘妙世界》《机器鸡》，粉丝们称之为经典卡通频道大泄露。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And the timing raised eyebrows: it landed just days after Skydance&#x27;s one hundred ten billion dollar takeover of Warner Brothers. No evidence links it to the merger, but the internet loves a coincidence.</p><p class=\"zh\">时间点很微妙：泄露发生在 Skydance 以一千一百亿美元收购华纳兄弟的几天之后。目前没有证据表明两者有关，但网友最爱这种巧合。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Google took down the original link, but the files had been circulating for hours. Artists are torn: some call it theft, others call it preservation.</p><p class=\"zh\">谷歌已经下架了最初的分享链接，但文件已经流传了好几个小时。动画师们意见分裂：有人说是盗窃，有人说是保护，因为工作室重组时这些老文件可能永远消失。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Your line to steal: Have you seen the Cartoon Network leak? Two hundred gigabytes of secret files, basically a time capsule from our childhood.</p><p class=\"zh\">拿去用的句子：看到卡通频道泄露事件了吗？两百 GB 的机密文件，简直是来自我们童年的时间胶囊。</p></div></div></div><div class=\"quickq\"><div class=\"quickq-title\">🎲 今日快问</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Random question time. Alex: if you could wake up tomorrow with one world-class skill, zero practice required, what are you picking?</p><p class=\"zh\">快问快答时间。Alex：如果明天醒来你就能拥有一样世界级技能，零练习、直接满级，你选什么？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Parallel parking. First try, every try, no audience of pedestrians judging me.</p><p class=\"zh\">侧方停车。一次成功，每次成功，再也不用满头大汗，也没有围观的路人对我指指点点。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Respect. I am going with the power nap: fall asleep anywhere in under a minute. A world-class sleeper.</p><p class=\"zh\">respect，我选秒睡：在哪儿都能一分钟内睡着，飞机上、沙发上、吵闹的办公室，世界级睡眠大师。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">You already fall asleep during movies.</p><p class=\"zh\">你看电影的时候本来就睡得着。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">That is boredom, not skill. Imagine napping through a red-eye flight and waking up in a new city feeling brand new.</p><p class=\"zh\">那是无聊，不是技能。想象一下，在红眼航班上睡一觉，醒来就在一座新城市，整个人焕然一新。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Fine, that beats parking. Listeners, steal this question today: if you could master one skill overnight, what would it be? It works at lunch, at parties, everywhere.</p><p class=\"zh\">好吧，这确实赢了停车。听众们，今天就把这个问题偷走：如果你能一夜掌握一样技能，你选什么？午饭、聚会，哪里都好用。</p></div></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 Words to steal 生词本</div><ul><li><b>peaks and troughs</b><span>经济的高峰与低谷；起伏</span></li><li><b>forward-looking</b><span>有前瞻性的；着眼未来的</span></li><li><b>distillation attack</b><span>蒸馏攻击；通过大量提问套取 AI 模型能力的手段</span></li><li><b>proxy network</b><span>代理网络</span></li><li><b>false positive</b><span>误报；误判</span></li><li><b>gigaleak</b><span>（网络用语）大规模文件泄露事件</span></li><li><b>storyboard</b><span>故事板；分镜脚本</span></li><li><b>model sheet</b><span>角色设定表；人物造型参考图</span></li></ul></div>\n    </article>"}, {"date": "2026-10-12", "row": "<div class=\"ep-row\" data-date=\"2026-10-12\"><div class=\"ep-row-title\">茶水间英文 - 10月12日 | 酿酒人掀翻道奇、苹果涨价怪AI、咖啡机偷流量</div><div class=\"ep-row-hook\">Brewers stun Skubal in NLCS opener, Apple&#x27;s AI memory tax, and a Keurig&#x27;s terabyte coffee break</div><div class=\"ep-row-meta\">2026-10-12 · 全文 786 词</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>茶水间英文 - 10月12日 | 酿酒人掀翻道奇、苹果涨价怪AI、咖啡机偷流量</h2>\n      <div class=\"meta\">2026-10-12 · 全文 786 词</div>\n      <div class=\"summary\"><b>📌 一句话速览</b>　酿酒人在国联冠军赛首战击败了他们差点交易来的王牌投手、AI 数据中心抢内存逼得苹果给 Mac 和 iPad 涨价、智能咖啡机十天上传 1TB 数据，外加一道终身免费的快问快答。</div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-daily-manifest/main/mp3/2026-10-12.mp3\"></audio>\n      <details open>\n        <summary>📄 中英对照文字稿</summary>\n        <div class=\"transcript\"><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">1</span>酿酒人掀翻道奇</div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Three stories today, each with one ready-to-steal line. Let us start with the biggest drama of the weekend, and it happened on a baseball field.</p><p class=\"zh\">今天聊三个话题，每个都附一句拿来即用的英文开场白。先从周末最大的 drama 开始，它发生在一个棒球场上。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">The Milwaukee Brewers just took game one of the National League Championship Series from the Los Angeles Dodgers, two to one.</p><p class=\"zh\">密尔沃基酿酒人队刚刚在国联冠军赛首战中以二比一掀翻了洛杉矶道奇队。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">And here is why this is such a great story. The Dodgers started Tarik Skubal, their superstar pitcher, the guy they grabbed at the trade deadline. The Brewers were actually one of the teams bidding for him.</p><p class=\"zh\">而这个故事最妙的地方是：道奇先发的是他们的王牌投手 Tarik Skubal，正是他们在交易截止日刚抢到的人。而酿酒人当时也是出价竞购的球队之一。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So Milwaukee got to face the ace they almost bought, and they beat him. That is some movie-level revenge.</p><p class=\"zh\">所以密尔沃基对上了他们差点买下的王牌，还把人家给赢了。这简直是电影级的复仇。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly. In the fourth, Brice Turang tied the game with a solo home run. An inning later, a twenty-one-year-old rookie named Luis Lara knocked in the winning run with a single.</p><p class=\"zh\">没错。第四局，Brice Turang 一支阳春本垒打扳平比分。下一局，二十一岁的新人 Luis Lara 一支安打打回制胜分。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And the best part? At the deadline, the Brewers refused to give up their young players to get Skubal, and people criticized them. On Sunday, those exact young players were the reason they won. The Dodgers are chasing three straight championships, something no National League team has ever done, and Milwaukee has not reached a World Series since nineteen eighty-two. Game two is tonight.</p><p class=\"zh\">最有意思的是什么？交易截止日时，酿酒人拒绝用自家年轻球员去换 Skubal，还被很多人批评。结果周日，恰恰是这些年轻人带队赢球。道奇在冲击史无前例的三连冠，而密尔沃基上一次进世界大赛还是十九八二年。今晚还有第二场。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Steal this line. Did you hear the Brewers beat the ace they almost traded for, with a twenty-one-year-old rookie driving in the winning run? October baseball never disappoints.</p><p class=\"zh\">拿走这句开场白：听说没？酿酒人击败了他们差点交易来的王牌投手，制胜分还是个二十一岁的新人打回来的。十月的棒球永远不让人失望。</p></div></div></div><div class=\"topic\"><div class=\"topic-head\"><span class=\"topic-num\">2</span>苹果涨价怪AI</div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">Never does. Story two hits your wallet directly. The A I boom just made your next laptop more expensive.</p><p class=\"zh\">确实如此。第二个话题，直接关系你的钱包。AI 热潮让你下一台笔记本电脑变贵了。</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Here is the short version. A I companies and gadget makers are fighting over the same ingredient, memory chips. A I data centers are buying memory by the truckload, so there is barely any left for regular gadgets, and memory chip prices nearly doubled in the first three months of this year alone.</p><p class=\"zh\">简单版：AI 公司和电子产品制造商在抢同一种原料——内存芯片。AI 数据中心成车地囤内存，普通电子设备就没剩多少了，今年头三个月内存芯片价格就翻了近一倍。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">And so Apple raised prices on a bunch of Macs and iPads?</p><p class=\"zh\">所以苹果给一堆 Mac 和 iPad 涨价了？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\">Exactly. The MacBook Air went from one thousand ninety-nine to one thousand two hundred ninety-nine dollars. Meanwhile the chip makers are printing money. Micron reported memory sales up more than three hundred percent, and its stock has climbed more than five hundred percent in the past year.</p><p class=\"zh\">没错。MacBook Air 从一千零九十九涨到一千二百九十九美元。与此同时芯片厂商赚翻了：美光财报内存销售额涨了三倍多，过去一年股价涨了五倍多。</p></div></div><div class=\"turn jordan\"><span class=\"speaker\">Jordan</span><div class=\"lines\"><p class=\"en\">So the chip makers get rich and the rest of us pay for it. When does this end?</p><p class=\"zh\">所以芯片厂商赚得盆满钵满，代价是我们掏腰包。这什么时候是个头？</p></div></div><div class=\"turn alex\"><span class=\"speaker\">Alex</span><div class=\"lines\"><p class=\"en\"
