<script>
const EPISODES = [{"date": "2026-10-24", "row": "<div class=\"ep-row\" data-date=\"2026-10-24\"><div class=\"ep-row-title\">小小英文新鲜事 - 1024 | 巨型吹风机、变色虾眼、深海巨虫</div><div class=\"ep-row-meta\">2026-10-24 · 468 词 · Word of the day: switch</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1024 | 巨型吹风机、变色虾眼、深海巨虫</h2>\n      <div class=\"meta\">2026-10-24 · 全文 468 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>巨型吹风机</li><li>变色虾眼</li><li>深海巨虫</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-24.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">switch<span>（开关）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>谜语时间：我比大人还高、会吹热风，但我不是龙——我是谁？答案：巨型吹风机！</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back to Little English News! I am Mia!</p><p class=\"zh\">嗨朋友们，欢迎回到小小英文新鲜事！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I am Lina! It is Saturday, October twenty-fourth!</p><p class=\"zh\">还有我 Lina！今天是十月二十四日，星期六！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Three brand new stories today!</p><p class=\"zh\">今天有三个全新的故事！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">What is first?</p><p class=\"zh\">第一个是什么？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! Two kids dreamed up a giant hairdryer, and engineers actually built it!</p><p class=\"zh\">故事一！两个小朋友梦想出一个巨型吹风机，工程师真的把它造出来了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A giant hairdryer? As big as a house?</p><p class=\"zh\">巨型吹风机？有房子那么大吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Almost as tall as a grown-up! Five feet nine inches long and five feet three inches tall! About seven times bigger than a normal hairdryer!</p><p class=\"zh\">差不多跟大人一样高！长五英尺九英寸，高五英尺三英寸！比普通吹风机大约大七倍！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Whoa! Does it actually blow air?</p><p class=\"zh\">哇！它真的能吹风吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It really works! A motor fan blows the air, and oven heating parts make it hot!</p><p class=\"zh\">真的能用！马达风扇吹出风，烤箱加热零件让风变热！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Whose wild idea was that?</p><p class=\"zh\">这是谁的奇思妙想？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Two kids, Kiki and Thea! More than five thousand kids sent in invention ideas, and their giant hairdryer won!</p><p class=\"zh\">两个小朋友，Kiki 和 Thea！五千多个小朋友寄来了发明点子，她们的巨型吹风机赢了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">So kids can dream it, and grown-ups build it?</p><p class=\"zh\">所以小朋友可以做梦，大人来把它造出来？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That is the magic! The same team once built the biggest electric toothbrush in the world! And now their giant hairdryer is in the Guinness World Records book for twenty twenty-seven!</p><p class=\"zh\">这就是魔法！同一个团队曾经造过世界上最大的电动牙刷！现在他们的巨型吹风机进了二零二七年的吉尼斯世界纪录书！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I want a giant toothbrush too!</p><p class=\"zh\">我也想要一个巨型牙刷！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Classic Lina! Story two! A shrimp with superpower eyes!</p><p class=\"zh\">哈哈，典型的 Lina！故事二！一只眼睛有超能力的小虾！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A shrimp? With superpowers? Does it fly?</p><p class=\"zh\">小虾？有超能力？它会飞吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Not fly, but see! This mantis shrimp sees colors we cannot even imagine! Its eyes work like a light switch! One color turns it on, another turns it off!</p><p class=\"zh\">不会飞，但是会看！这只螳螂虾能看到我们根本想象不到的颜色！它的眼睛像电灯开关一样工作！一种颜色开，一种颜色关！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">So its eyes go click clack, click clack?</p><p class=\"zh\">所以它的眼睛是咔哒咔哒、咔哒咔哒？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Click clack, you said it! Four of its color catchers can flip back and forth like switches!</p><p class=\"zh\">咔哒咔哒，你说对了！它的四个颜色捕捉器能像开关一样来回翻转！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can I borrow those eyes for hide and seek?</p><p class=\"zh\">我能借这双眼睛玩捉迷藏吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Brilliant thinking! With those eyes, nobody could ever hide from you!</p><p class=\"zh\">绝妙的想法！有了这双眼睛，谁也躲不过你！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! A giant sea bug was hiding in a museum!</p><p class=\"zh\">故事三！一只巨型海虫躲在博物馆里！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A bug? In a museum? Was it on vacation?</p><p class=\"zh\">虫子？在博物馆？它在度假吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! On a shelf! Scientists in Germany opened an old museum drawer and found a giant isopod from Puerto Rico, sitting there since the nineteen eighties under the wrong name!</p><p class=\"zh\">哈哈，在架子上！德国的科学家打开一个旧博物馆抽屉，发现了一只来自波多黎各的巨型深海巨虫，从上世纪八十年代起就挂着错误的名字躺在那里！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A giant bug with the wrong name tag? Poor guy!</p><p class=\"zh\">一只挂错名牌的巨型虫子？可怜的家伙！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Poor guy indeed! Then scientists took a super close look, and surprise! A brand new species!</p><p class=\"zh\">确实可怜！然后科学家仔细一看，惊喜！是一个全新的物种！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">How giant is giant? As big as my backpack?</p><p class=\"zh\">多巨算巨？有我的书包那么大吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Almost! Almost thirteen inches long! It lives deep down in the dark sea, and it looks like a giant woodlouse!</p><p class=\"zh\">差不多！差不多十三英寸长！它住在深深的黑暗海底，看起来像一只巨型鼠妇！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A giant roly poly of the deep sea! Does it roll into a ball?</p><p class=\"zh\">深海里的巨型卷卷虫！它会缩成一个球吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">You read my mind!</p><p class=\"zh\">你读懂了我的心思！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Word of the day! Switch! A switch is a little button that turns something on or off! Say it with us, friends! Switch!</p><p class=\"zh\">今日单词！Switch！Switch 就是一个能把东西打开或关掉的小按钮！跟朋友们一起说！Switch！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Switch!</p><p class=\"zh\">Switch！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Louder! SWITCH!</p><p class=\"zh\">再大声点！SWITCH！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">SWITCH!</p><p class=\"zh\">SWITCH！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Perfect! You sounded like true scientists! And you too, friends!</p><p class=\"zh\">完美！你们听起来像真正的科学家！你们也是，朋友们！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Riddle time! Listen close! I am bigger than a grown-up, I blow hot air, but I am not a dragon! What am I?</p><p class=\"zh\">谜语时间！仔细听！我比大人还高，我吹热风，但我不是龙！我是谁？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Hmm! A giant... hairdryer?</p><p class=\"zh\">嗯！一个巨型的……吹风机？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ding ding ding! Correct! A giant hairdryer! Thanks for listening, friends! See you next time!</p><p class=\"zh\">叮叮叮！答对了！一个巨型吹风机！谢谢收听，朋友们！下次见！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye bye! I am drawing my giant hairdryer!</p><p class=\"zh\">拜拜！我要去画我的巨型吹风机了！</p></div></div></div>\n      </details>\n      <div class=\"photos\"><div class=\"photos-title\">📸 本期真实照片</div><figure class=\"photo\"><img src=\"https://i.accu.co.uk/news/307-KIS-x-Accu-Guinness-World-Record-Hairdryer-Ruth-Hairdryer-GWR-photo-1.jpg\" alt=\"巨型吹风机\" loading=\"lazy\"><figcaption>📷 巨型吹风机<span class=\"photo-credit\">Photo: Paul Michael Hughes / Guinness World Records</span></figcaption></figure><figure class=\"photo\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/07/Peacock_shrimp_at_manta_reef_dsc04367.jpg\" alt=\"变色虾眼\" loading=\"lazy\"><figcaption>📷 变色虾眼<span class=\"photo-credit\">Photo: Peter Southwood / Wikimedia Commons (CC BY-SA 3.0)</span></figcaption></figure><figure class=\"photo\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/1/18/Giant_isopod.jpg\" alt=\"深海巨虫\" loading=\"lazy\"><figcaption>📷 深海巨虫<span class=\"photo-credit\">Photo: NOAA (public domain)</span></figcaption></figure></div>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">switch<span>（开关）</span></div><div class=\"vocab-def\">a little button that turns something on or off</div><div class=\"vocab-ex\">例：flip the switch（拨动开关）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">invention<span>（发明）</span></div><div class=\"vocab-def\">something new that someone makes for the first time</div><div class=\"vocab-ex\">例：a wild invention（一个奇思妙想的发明）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">isopod<span>（深海巨虫）</span></div><div class=\"vocab-def\">a sea animal with a hard shell that looks like a giant woodlouse</div><div class=\"vocab-ex\">例：a giant isopod（一只深海巨虫）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">record<span>（纪录）</span></div><div class=\"vocab-def\">the best ever in something</div><div class=\"vocab-ex\">例：a world record（世界纪录）</div></div></div>\n    </article>"}, {"date": "2026-10-22", "row": "<div class=\"ep-row\" data-date=\"2026-10-22\"><div class=\"ep-row-title\">小小英文新鲜事 - 1022 | 毒猴现身、小飞象章鱼、翻筋斗蛇</div><div class=\"ep-row-meta\">2026-10-22 · 501 词 · Word of the day: cartwheel</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1022 | 毒猴现身、小飞象章鱼、翻筋斗蛇</h2>\n      <div class=\"meta\">2026-10-22 · 全文 501 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>毒猴现身</li><li>小飞象章鱼</li><li>翻筋斗蛇</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-22.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">cartwheel<span>（侧手翻）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>小挑战：今天把单词 cartwheel 教给一个人，再和他一起翻个侧手翻——翻不起来，在草地上滚一圈也算！</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back to Little English News! I am Mia!</p><p class=\"zh\">小朋友们好，欢迎回到《小小英文新鲜事》！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I am Lina! It is Thursday, October twenty-second!</p><p class=\"zh\">我是 Lina！今天是星期四，十月二十二日！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Oh, I am SO happy it is Thursday! Three brand new stories are waiting!</p><p class=\"zh\">啊，我太开心了，今天是星期四！三个全新的故事在等着我们！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I woke up ready! Give me the news!</p><p class=\"zh\">我一醒来就准备好啦！快给我讲新闻！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! A cute little monkey with venom is back!</p><p class=\"zh\">故事一！一只带着毒液的可爱小猴子回来啦！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Venom? Like, poison? In a cute monkey?</p><p class=\"zh\">毒液？像毒药一样？在一只可爱的小猴子身上？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Exactly! It is called a slow loris! Say it with me, slow LOR iss!</p><p class=\"zh\">没错！它叫懒猴！跟我一起说，slow LOR iss！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Slow LOR iss! Sounds like a sleepy loris!</p><p class=\"zh\">Slow LOR iss！听起来像只困困的懒猴！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! It does sound sleepy! It has huge eyes and reddish brown fur, like a tiny storybook animal! Scientists thought it was gone, but it was found alive on an island called BANG kuh!</p><p class=\"zh\">哈哈！听起来是挺困的！它有大大的眼睛和红棕色的毛，像故事书里的小动物！科学家以为它消失了，结果在叫 BANG kuh 的岛上发现了活的！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">BANG kuh! That sounds like a drum!</p><p class=\"zh\">BANG kuh！像是在打鼓！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Nailed it! Bang, bang, kuh! No one had seen one in science books for almost one hundred years!</p><p class=\"zh\">说得太对了！邦、邦、咔！将近一百年，科学书里都没见过它了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Was it hiding under the bed?</p><p class=\"zh\">它是躲在床底下了吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! I like how you think! It was hiding in the forest! And listen, its bite has venom, so look, do not touch!</p><p class=\"zh\">哈哈，我喜欢你的想法！它躲在森林里！而且听好了，它的咬咬有毒液，只能看，不能摸！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Cute face, spicy bite!</p><p class=\"zh\">可爱的脸蛋，火辣的咬咬！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! Deep sea scientists just met the cutest octopus ever!</p><p class=\"zh\">故事二！深海科学家刚刚遇到了史上最可爱的章鱼！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">An octopus? Does it have eight arms for hugging?</p><p class=\"zh\">章鱼？它有八条胳膊可以抱抱吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Eight arms, and two floppy ear flaps! It is called a Dumbo octopus, because its flaps look like Dumbo the elephant ears!</p><p class=\"zh\">八条胳膊，还有两只垂下来的耳鳍！它叫小飞象章鱼，因为它的鳍长得像小飞象的大耳朵！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">An octopus with elephant ears? That is silly!</p><p class=\"zh\">长着象耳朵的章鱼？太好笑了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I know, right? Scientists were exploring a deep sea mountain near Palau, and this little guy just bopped into view! One scientist said, I am shaking, I am so excited!</p><p class=\"zh\">是吧？科学家们正在帕劳附近的深海山上探险，这个小家伙就这样蹦进了镜头！一位科学家说，我激动得都在发抖！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I would shake too! Was it tiny?</p><p class=\"zh\">我也会发抖！它很小吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Super tiny and super rare! They live way down deep where it is dark and cold. Most people never ever see one!</p><p class=\"zh\">超级小，超级稀有！它们住在又黑又冷的深海里。大多数人一辈子都见不到一只！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Lucky scientists! Can I keep one as a pet?</p><p class=\"zh\">幸运的科学家！我能养一只当宠物吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! They need the deep dark sea to be happy. But we can draw one! Eight arms, two floppy ears, big smile!</p><p class=\"zh\">哈哈！它们需要在深深的黑黑的海里才开心。不过我们可以画一只！八条胳膊，两只垂耳，大大的笑脸！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I am drawing mine with a crown! The queen of the deep sea!</p><p class=\"zh\">我要给我的画上王冠！深海女王！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! Some snakes do cartwheels!</p><p class=\"zh\">故事三！有些蛇会翻筋斗！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Snakes? Doing cartwheels? Like gymnasts?</p><p class=\"zh\">蛇？会翻筋斗？像体操运动员一样？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Just like gymnasts! When danger comes, these little snakes roll away like a wheel, head over tail, head over tail!</p><p class=\"zh\">哈哈，就像体操运动员！危险来的时候，这些小蛇会像车轮一样滚走，头翻过尾巴，头翻过尾巴！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Vroom vroom, snake wheel!</p><p class=\"zh\">呜呜呜，蛇蛇车轮！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Zoom! They can roll almost eight miles per hour! That is faster than you riding your scooter!</p><p class=\"zh\">嗖！它们最快能滚到每小时八英里！比你骑滑板车还快！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A scooter snake! I want to race it!</p><p class=\"zh\">滑板车蛇！我要跟它比赛！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! I would cheer for you! But please do not race wild snakes!</p><p class=\"zh\">哈哈，我一定给你加油！但千万不要跟野生的蛇比赛哦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Word of the day! Cartwheel! A cartwheel is when you roll sideways like a wheel, hands, then feet, then hands! Say it with us, friends! Cartwheel!</p><p class=\"zh\">今日单词！Cartwheel！侧手翻就是像车轮一样侧着滚，先手，再脚，再手！跟我们一起念，小朋友们！Cartwheel！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Cartwheel!</p><p class=\"zh\">Cartwheel！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Louder! CARTWHEEL!</p><p class=\"zh\">再大声点！CARTWHEEL！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">CARTWHEEL!</p><p class=\"zh\">CARTWHEEL！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">YES! You crushed it! And you too, friends!</p><p class=\"zh\">太棒了！你做得超好！小朋友们，你们也是！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Tiny challenge time! Teach one person the word cartwheel today, and try one cartwheel together! If you cannot do one yet, rolling on soft grass totally counts!</p><p class=\"zh\">小挑战时间！今天把单词 cartwheel 教给一个人，再和他一起翻个侧手翻！如果还翻不起来，在软软的草地上滚一圈也算数！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I am going to teach grandma!</p><p class=\"zh\">我要去教奶奶！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Grandma doing cartwheels? Somebody get the camera! That is all for today! Thanks for listening, friends! See you next time!</p><p class=\"zh\">奶奶翻侧手翻？快把相机拿来！今天的节目就到这里！谢谢收听，小朋友们！下次见！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye bye! I am going to cartwheel to the kitchen!</p><p class=\"zh\">拜拜！我要翻着筋斗去厨房啦！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">cartwheel<span>（侧手翻）</span></div><div class=\"vocab-def\">a fun sideways roll, hands first, then feet, then hands</div><div class=\"vocab-ex\">例：do a cartwheel（翻一个侧手翻）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">venom<span>（毒液）</span></div><div class=\"vocab-def\">a poison some animals use to protect themselves</div><div class=\"vocab-ex\">例：venom in a bite（咬一口就有毒）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">loris<span>（懒猴）</span></div><div class=\"vocab-def\">a small furry animal with huge eyes that moves very slowly</div><div class=\"vocab-ex\">例：a sleepy loris（一只困困的懒猴）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">flap<span>（拍打；垂瓣）</span></div><div class=\"vocab-def\">a flat piece that moves up and down</div><div class=\"vocab-ex\">例：ear flaps（垂耳鳍）</div></div></div>\n    </article>"}, {"date": "2026-10-20", "row": "<div class=\"ep-row\" data-date=\"2026-10-20\"><div class=\"ep-row-title\">小小英文新鲜事 - 1020 | 彗星跳绳、面条海虫、长毛蜗牛</div><div class=\"ep-row-meta\">2026-10-20 · 424 词 · Word of the day: amber</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1020 | 彗星跳绳、面条海虫、长毛蜗牛</h2>\n      <div class=\"meta\">2026-10-20 · 全文 424 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>彗星跳绳</li><li>面条海虫</li><li>长毛蜗牛</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-20.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">amber<span>（琥珀）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>猜谜时间：我是脏兮兮的大雪球、拖着闪亮的尾巴，从太阳系头顶飞过，几千年才拜访一次太阳——我是谁？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back! I&#x27;m Mia!</p><p class=\"zh\">小朋友们好，欢迎回来！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Tuesday, October twentieth!</p><p class=\"zh\">我是 Lina！今天是十月二十日，星期二！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Three brand new stories! Are you ready?</p><p class=\"zh\">三个全新的故事！你们准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I woke up ready!</p><p class=\"zh\">我一睁眼就准备好了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! A sneaky new comet was found in space!</p><p class=\"zh\">故事一！太空里发现了一颗鬼鬼祟祟的新彗星！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Sneaky? Was it hiding?</p><p class=\"zh\">鬼鬼祟祟？它在躲谁吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It was hiding above the solar system! The Euclid telescope takes pictures of faraway galaxies, and this comet photo bombed one of its pictures! It is flying way over the top of the sun and the planets, like a jump rope over all of them!</p><p class=\"zh\">它躲在太阳系的上方！欧几里得望远镜本来在拍遥远的星系，结果这颗彗星乱入了它的照片！它正从太阳和行星的头顶上飞过，就像在它们上面跳绳！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A comet jumping rope! Ten jumps in a row?</p><p class=\"zh\">一颗跳绳的彗星！能连跳十下吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay, that one got me! It takes this comet thousands of years to go around the sun once! It is one point three billion kilometers away, past Jupiter!</p><p class=\"zh\">好吧，这句把我逗笑了！这颗彗星绕太阳一圈要几千年！它离我们十三亿公里，远在木星之外！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Hi, faraway comet! I see you!</p><p class=\"zh\">嗨，远方的小彗星！我看到你啦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! New sea worms that look like walking spaghetti!</p><p class=\"zh\">故事二！长得像会走路的意大利面的新海虫！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Spaghetti that can walk? With meatballs?</p><p class=\"zh\">会走路的意大利面？配肉丸吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">No meatballs! These worms live deep down in the Indian Ocean! They have long noodle arms called tentacles to grab food, and tiny suction cups to stick to rocks!</p><p class=\"zh\">没有肉丸！这些虫子住在印度洋的深海里！它们有长长的面条胳膊叫触手，用来抓食物，还有小小的吸盘可以粘在岩石上！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Sticky feet! Like the sticky hands from the toy store!</p><p class=\"zh\">黏黏的脚！就像玩具店里卖的黏黏手！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Whoa, whoa, whoa! Yes! Just like those! The suction cups help them hold on!</p><p class=\"zh\">哇哦哇哦！对！简直一模一样！这些吸盘能帮它们在海水推挤的时候抓牢！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can I keep one in the bathtub?</p><p class=\"zh\">我能在浴缸里养一条吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">You would, wouldn&#x27;t you! They belong in the deep sea, not the bathtub!</p><p class=\"zh\">你肯定会这么想！它们属于深海，不属于浴缸！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! A hairy snail, stuck in golden tree goo for ninety nine million years!</p><p class=\"zh\">故事三！一只长毛的蜗牛，在金色的树胶里困了九千九百万年！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A snail with HAIR? Like a tiny grandpa?</p><p class=\"zh\">长毛的蜗牛？像个小老头？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That is pure genius, and also pure silliness! When dinosaurs walked the earth, this little snail crawled through sticky tree sap, got stuck, and the sap turned hard and golden! Now it is amber, and we can still see the snail&#x27;s hair!</p><p class=\"zh\">这个想法太天才了，也太搞笑了！恐龙还在地球上散步的时候，这只小蜗牛爬进了黏黏的树胶，被粘住了，树胶后来变硬变金黄！现在它叫琥珀，我们还能看到蜗牛的毛！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Does it have a tiny comb for its tiny hair?</p><p class=\"zh\">它有给小头发用的小梳子吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay, I did NOT see that coming! No comb! But its hair helped it feel the world!</p><p class=\"zh\">好吧，这句我完全没想到！没有梳子！但它的毛能帮它感受周围的世界！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Word of the day! Amber! Amber is golden, hard tree sap that can trap tiny animals for millions of years! Say it with us, friends! Amber!</p><p class=\"zh\">今日单词！Amber！Amber 是金色的、硬硬的树胶，能把小动物困在里面几百万年！跟我们一起说，朋友们！Amber！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Amber!</p><p class=\"zh\">Amber！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Louder! AMBER!</p><p class=\"zh\">再大声一点！AMBER！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">AMBER!</p><p class=\"zh\">AMBER！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">You got it, little explorer! And you too, friends!</p><p class=\"zh\">你说对啦，小小探险家！朋友们，你们也一样！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Riddle time! I am a giant dirty snowball with a sparkly tail! I fly over the top of the solar system, and I take thousands of years to visit the sun! What am I?</p><p class=\"zh\">猜谜时间！我是个脏兮兮的大雪球，拖着一条闪亮的尾巴！我从太阳系的上方飞过，要几千年才拜访一次太阳！我是谁？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Hmm... a snowman in space?</p><p class=\"zh\">嗯……太空里的雪人？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Now THAT is a plan, but no! Friends, shout the answer! A comet!</p><p class=\"zh\">这主意不错，但不对！朋友们，大声喊出答案！一颗彗星！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A comet!</p><p class=\"zh\">一颗彗星！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That is all for today! Thanks for listening, friends! See you next time!</p><p class=\"zh\">今天就到这里！谢谢收听，小朋友们！下次见！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye bye! I am going to jump rope like a comet!</p><p class=\"zh\">拜拜！我要像彗星一样去跳绳啦！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">amber<span>（琥珀）</span></div><div class=\"vocab-def\">golden, hard tree sap that can trap tiny animals for millions of years</div><div class=\"vocab-ex\">例：a piece of amber（一块琥珀）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">comet<span>（彗星）</span></div><div class=\"vocab-def\">a giant snowball in space with a sparkly tail</div><div class=\"vocab-ex\">例：a new comet（一颗新彗星）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">tentacle<span>（触角）</span></div><div class=\"vocab-def\">a long, bendy arm some sea animals use to grab food</div><div class=\"vocab-ex\">例：spaghetti-like tentacles（像面条一样的触角）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">orbit<span>（轨道）</span></div><div class=\"vocab-def\">the path one thing travels around another thing in space</div><div class=\"vocab-ex\">例：the comet&#x27;s orbit（这颗彗星的轨道）</div></div></div>\n    </article>"}, {"date": "2026-10-18", "row": "<div class=\"ep-row\" data-date=\"2026-10-18\"><div class=\"ep-row-title\">小小英文新鲜事 - 1018 | 海牛坐飞机、歪脖子星球、面条长颈鹿</div><div class=\"ep-row-meta\">2026-10-18 · 487 词 · Word of the day: lopsided</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1018 | 海牛坐飞机、歪脖子星球、面条长颈鹿</h2>\n      <div class=\"meta\">2026-10-18 · 全文 487 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>海牛坐飞机</li><li>歪脖子星球</li><li>面条长颈鹿</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-18.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">lopsided<span>（歪向一边的）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>二选一：跟六只啃生菜的海牛宝宝一起坐飞机，还是去歪脖子星球上一边穿泳衣一边穿羽绒服？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back! I&#x27;m Mia!</p><p class=\"zh\">大家好，欢迎回来！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Sunday, October eighteenth!</p><p class=\"zh\">我是 Lina！今天是十月十八日，星期天！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ooh, Sunday! Three fun stories today! Ready?</p><p class=\"zh\">哦，星期天！今天有三个好玩的故事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I was born ready!</p><p class=\"zh\">我天生就准备好了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! Six baby manatees just took an airplane ride!</p><p class=\"zh\">第一个故事！六只海牛宝宝刚刚坐了一次飞机！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Manatees on a plane? Were they the pilots?</p><p class=\"zh\">海牛坐飞机？它们是飞行员吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! You crack me up! No, they were the passengers! These six babies lost their moms in Florida, and kind people rescued them! One little girl manatee named Celine was only forty eight pounds when she was found! Now she weighs four hundred twenty pounds!</p><p class=\"zh\">哈哈！你把我逗笑了！不，它们是乘客！这六只小宝宝在佛罗里达失去了妈妈，是好心人救了它们！其中一只叫 Celine 的小海牛被发现时只有四十八磅！现在它已经有四百二十磅了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Whoa! From teeny tiny to supersized! Go, Celine, go!</p><p class=\"zh\">哇！从小小个长到巨大！Celine 加油！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! Look at you cheering for her! You are right, she grew so fast! On Wednesday, all six flew to Ohio, where two zoos will feed them lots and lots of lettuce until they are strong enough to swim home to Florida!</p><p class=\"zh\">哈哈！看你为她欢呼的样子！你说得对，她长得太快了！周三，六只小海牛都飞去了俄亥俄，那里的两家动物园会喂它们吃好多好多生菜，直到它们壮到能自己游回佛罗里达！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Six manatees on a plane? I call the window seat next to Celine!</p><p class=\"zh\">一整架飞机的海牛？我要在 Celine 旁边占个靠窗的座位！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I bet the manatees saved you a seat!</p><p class=\"zh\">我打赌海牛们给你留了座位！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! Scientists found a planet that is lopsided!</p><p class=\"zh\">第二个故事！科学家发现了一颗歪向一边的星球！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Lop... what now?</p><p class=\"zh\">歪……歪什么？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Lopsided! It means one side is bigger than the other side! This planet is called Wasp Seventeen Bee, one thousand three hundred light years away! The James Webb telescope saw that its sky puffs out more on one side, like a lopsided balloon!</p><p class=\"zh\">Lopsided！意思是“歪向一边的”！这颗星球叫 Wasp-17b，离我们一千三百光年远！詹姆斯·韦伯望远镜看到，它的天空一边鼓得更大，就像一个歪向一边的气球！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Like my lopsided ponytail this morning!</p><p class=\"zh\">就像我今天早上歪向一边的马尾辫！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Exactly like that! One side of the planet is scorching hot, and the other side is way cooler! Six hundred fifty degrees apart!</p><p class=\"zh\">哈哈！一模一样！这颗星球的一边滚烫滚烫，另一边却凉快得多！两边相差六百五十度！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I would pack a swimsuit AND a winter coat!</p><p class=\"zh\">那我得带泳衣，还得带羽绒服！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I love that plan!</p><p class=\"zh\">我太喜欢这个计划了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! A baby giraffe took a super long road trip! His name is Tambi, and his name means noodle in swa HEE lee!</p><p class=\"zh\">第三个故事！一只小长颈鹿进行了一次超级长的公路旅行！他叫 Tambi，在斯瓦希里语里他的名字是“面条”的意思！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Noodle?! Did his parents name him after lunch?</p><p class=\"zh\">面条？！他的爸爸妈妈是照着午饭给他起的名吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Maybe! He is one year old, and he traveled three thousand kilometers across Australia, from one zoo to another!</p><p class=\"zh\">哈哈！说不定哦！他一岁大，穿越了整个澳大利亚，走了三千公里，从一家动物园搬到另一家动物园！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Did he stick his head out the window?</p><p class=\"zh\">他有没有把头伸出车窗外？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Oh, I would pay to see that! The other giraffes welcomed him on Sunday morning!</p><p class=\"zh\">哦，我愿意花钱看这个！星期天早上，其他长颈鹿一起欢迎了他的到来！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Baby noodles everywhere!</p><p class=\"zh\">到处都是小面条！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! Word of the day! Lopsided! Lopsided means one side is bigger or higher than the other side! Like planet Wasp Seventeen Bee, puffier on one side! Say it with us, friends! Lopsided!</p><p class=\"zh\">哈哈！今日单词！Lopsided！Lopsided 的意思是一边比另一边大或高！就像 Wasp-17b 星球，一边更鼓！跟我们一起说，朋友们！Lopsided！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Lopsided!</p><p class=\"zh\">Lopsided！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">One more time, nice and loud! Lopsided! Do not forget the D!</p><p class=\"zh\">再来一次，大声点！Lopsided！别把最后的 D 吃掉哦！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">LOPSIDED!</p><p class=\"zh\">LOPSIDED！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Nailed it!</p><p class=\"zh\">说得太棒了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Would you rather time! Would you rather fly on a plane with six baby manatees munching lettuce in the seats next to you?</p><p class=\"zh\">二选一时间！你愿意跟六只坐在旁边座位上啃生菜的海牛宝宝一起坐飞机吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ooh!</p><p class=\"zh\">哦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Or ride the lopsided planet, where one side is super hot and the other side is cool and puffy?</p><p class=\"zh\">还是愿意去那颗歪向一边的星球，一边超级热，另一边凉快又蓬松？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">The manatees! I will share my snacks!</p><p class=\"zh\">选海牛！我会跟它们分享我的零食！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">No way! I would pick the lopsided planet! Friends, which would YOU pick? Ask your mom and dad too!</p><p class=\"zh\">不行！我会选歪脖子星球！朋友们，你们选哪个？也问问爸爸妈妈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Mom always picks the weirdest one!</p><p class=\"zh\">妈妈总是选最奇怪的那个！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! That is why we love her! That&#x27;s all for today! Thanks for listening, friends! Bye!</p><p class=\"zh\">哈哈！这就是我们爱她的原因！今天就到这里！谢谢收听，朋友们！再见！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I am off to pack snacks for the manatees!</p><p class=\"zh\">再见！我去给海牛宝宝们打包零食啦！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">lopsided<span>（歪向一边的）</span></div><div class=\"vocab-def\">one side is bigger or higher than the other side</div><div class=\"vocab-ex\">例：a lopsided planet（歪向一边的星球）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">manatee<span>（海牛）</span></div><div class=\"vocab-def\">a big, gentle sea animal that eats plants</div><div class=\"vocab-ex\">例：a baby manatee（海牛宝宝）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">atmosphere<span>（大气层）</span></div><div class=\"vocab-def\">the layer of air around a planet</div><div class=\"vocab-ex\">例：a puffy atmosphere（蓬松的大气层）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">journey<span>（旅程）</span></div><div class=\"vocab-def\">a long trip from one place to another</div><div class=\"vocab-ex\">例：a long journey across Australia（穿越澳大利亚的长途旅行）</div></div></div>\n    </article>"}, {"date": "2026-10-17", "row": "<div class=\"ep-row\" data-date=\"2026-10-17\"><div class=\"ep-row-title\">小小英文新鲜事 - 1017 | 新恐龙命名、小熊猫起名、火星取土</div><div class=\"ep-row-meta\">2026-10-17 · 471 词 · Word of the day: discovery</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1017 | 新恐龙命名、小熊猫起名、火星取土</h2>\n      <div class=\"meta\">2026-10-17 · 全文 471 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>新恐龙命名</li><li>小熊猫起名</li><li>火星取土</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-17.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">discovery<span>（发现）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>猜谜时间：100亿年前咆哮过、长着巨爪、现在骨头睡在博物馆里——我是谁？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back! I&#x27;m Mia!</p><p class=\"zh\">大家好，欢迎回来！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Saturday, October seventeenth!</p><p class=\"zh\">我是 Lina！今天是十月十七日，星期六！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ooh, Saturday! The weekend is here! Three super fun stories today! Ready?</p><p class=\"zh\">哦，周六！周末到啦！今天有三个超好玩的新鲜事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">So ready!</p><p class=\"zh\">太准备好了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! A brand new dinosaur just got its name! And it was hiding in a museum for one hundred years!</p><p class=\"zh\">故事一！一只全新的恐龙刚刚有了自己的名字！而且它在博物馆里藏了整整一百年！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">One hundred years? Did the museum lose a dinosaur?</p><p class=\"zh\">一百年？博物馆把恐龙弄丢了吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Kind of! Scientists found its skull bone on an island in England, and it sat on a museum shelf since nineteen twenty four! Then this week, scientists scanned it and realized, this is a totally NEW dinosaur!</p><p class=\"zh\">哈哈！差不多吧！科学家在英格兰的一个小岛上发现了它的头骨化石，它从一九二四年就摆在博物馆的架子上！直到这周，科学家给它做了扫描，才发现这是一只全新的恐龙！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A whole century of waiting! What is its name?</p><p class=\"zh\">整整等了一百年！它叫什么名字？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Its name is in-VIK-tah-bell-ah-trix! It means unconquered female warrior!</p><p class=\"zh\">它的名字读作“因维克塔贝拉特里克斯”！意思是“不败女战士”！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Unconquered female warrior! Raaar!</p><p class=\"zh\">不败女战士！吼——！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! That roar was pretty good! It was as big as a tiger, a cousin of T-rex, with giant curved claws!</p><p class=\"zh\">哈哈！你吼得真不错！它有老虎那么大，是霸王龙的远房亲戚，还长着巨型弯爪！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! A tiny red panda cub needs a name! And you can help pick it!</p><p class=\"zh\">故事二！一只小小的小熊猫宝宝需要一个名字！你也可以帮忙选！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A red panda! Can I keep one at home?</p><p class=\"zh\">小熊猫！我可以在家里养一只吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">No way, Lina! It lives at the zoo in Washington D C! It was born in June, with red fur, a fluffy striped tail, and it munches bamboo all day!</p><p class=\"zh\">不行啦，Lina！它住在华盛顿特区的动物园里！它六月出生，长着红色的毛、毛茸茸的条纹尾巴，整天啃竹子！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Munch munch munch! What are the names?</p><p class=\"zh\">咔嚓咔嚓咔嚓！候选名字有哪些？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">The keepers picked three! Pyra, Dolpa, and Dolly, like the famous singer Dolly Parton! Which one would YOU pick, friends? Ask your mom and dad too!</p><p class=\"zh\">饲养员挑了三个！Pyra、Dolpa 和 Dolly，就像著名歌手 Dolly Parton 的名字！小朋友们，你会选哪个？也去问问爸爸妈妈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I pick Dolly! Then it can sing me to sleep!</p><p class=\"zh\">我选 Dolly！那它就可以唱歌哄我睡觉了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! I wish! Story three! Japan is launching a spaceship on Monday, to a moon of Mars!</p><p class=\"zh\">哈哈！我也想！故事三！日本要在周一发射一艘飞船，去火星的月亮上！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Mars has moons?</p><p class=\"zh\">火星还有月亮？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Two tiny ones! This spaceship is called M M X! It flies to a moon named FOH-boss, puffs out gas to scoop up moon dust, and brings it back to Earth in the year twenty thirty one!</p><p class=\"zh\">有两颗小小的！这艘飞船叫 M M X！它会飞到一颗叫 Phobos 的月亮上，吹出一股气体把月球尘埃“铲”进盒子，并在二〇三一年把尘埃带回地球！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">That is the slowest mail package ever!</p><p class=\"zh\">这简直是史上最慢的快递包裹！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Right?! Scientists want to learn how Mars got its moons!</p><p class=\"zh\">对吧？！科学家想搞清楚，火星的月亮到底是怎么来的！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Word of the day! Discovery! A discovery is when you find something new that nobody knew before! Like the new dinosaur! Say it with us, friends! Discovery!</p><p class=\"zh\">每日一词！Discovery！Discovery 就是发现了全新的、以前没人知道的东西！就像这只新恐龙！跟我们一起说！Discovery！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Discovery!</p><p class=\"zh\">Discovery！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">One more time, nice and loud! Discovery!</p><p class=\"zh\">再来一次，大声点！Discovery！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">DISCOVERY!</p><p class=\"zh\">DISCOVERY！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Bingo!</p><p class=\"zh\">答对啦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay, riddle time! Here is a riddle about today&#x27;s theme!</p><p class=\"zh\">好的，猜谜时间！来猜一个跟今天主题有关的谜语！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ooh! Go easy on me!</p><p class=\"zh\">哦！对我温柔点！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Listen up! I roared one hundred million years ago! I had giant claws and a mighty roar! Now my bones sleep in a museum! What am I?</p><p class=\"zh\">听好啦！我在一亿年前咆哮过！我长着巨爪，吼声震天！现在我的骨头睡在博物馆里！我是谁？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Hmm... a tired museum guard?</p><p class=\"zh\">嗯……一个困了的博物馆保安？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! Nope! Friends, shout your guess!</p><p class=\"zh\">哈哈哈！不对！小朋友们，大声喊出你们的答案！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Oh! I know! A dinosaur!</p><p class=\"zh\">哦！我知道！是恐龙！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">You are onto something! A dinosaur! Great guessing, friends!</p><p class=\"zh\">你摸到门路了！没错！是恐龙！小朋友们猜得太棒了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That&#x27;s all for today! Thanks for listening, friends! Bye!</p><p class=\"zh\">今天就到这里！谢谢收听，小朋友们！再见！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I am off to vote for Dolly the red panda!</p><p class=\"zh\">再见！我要去给小熊猫 Dolly 投票啦！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">discovery<span>（发现）</span></div><div class=\"vocab-def\">when you find something brand new that nobody knew before</div><div class=\"vocab-ex\">例：a new dinosaur discovery（恐龙新发现）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">warrior<span>（战士）</span></div><div class=\"vocab-def\">a brave fighter</div><div class=\"vocab-ex\">例：a female warrior（女战士）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">sample<span>（样品）</span></div><div class=\"vocab-def\">a tiny piece of something to study</div><div class=\"vocab-ex\">例：a small sample（一小份样品）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">vote<span>（投票）</span></div><div class=\"vocab-def\">to choose something by voting</div><div class=\"vocab-ex\">例：vote for a name（为名字投票）</div></div></div>\n    </article>"}, {"date": "2026-10-15", "row": "<div class=\"ep-row\" data-date=\"2026-10-15\"><div class=\"ep-row-title\">小小英文新鲜事 - 1015 | 超级大南瓜、恐龙蘑菇、火星车纪录</div><div class=\"ep-row-meta\">2026-10-15 · 425 词 · Word of the day: gigantic</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1015 | 超级大南瓜、恐龙蘑菇、火星车纪录</h2>\n      <div class=\"meta\">2026-10-15 · 全文 425 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>超级大南瓜</li><li>恐龙蘑菇</li><li>火星车纪录</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-15.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">gigantic<span>（巨大的）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>二选一：骑在汽车一样大的南瓜上滚下山坡，还是开着机器人小车横穿火星？你选哪个？也问问爸爸妈妈！</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back! I&#x27;m Mia!</p><p class=\"zh\">大家好，欢迎回来！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Thursday, October fifteenth!</p><p class=\"zh\">我是 Lina！今天是十月十五日，星期四！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Three gigantic stories! Ready?</p><p class=\"zh\">今天有三个超级大的新鲜事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Gigantic? Is that our word of the day?</p><p class=\"zh\">gigantic？这是我们今天的单词吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ooh, sneaky! Maybe it is, maybe it is not! Keep listening!</p><p class=\"zh\">哎呀，被你抓到啦！是也不是，继续听就知道啦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! A gigantic pumpkin! Three thousand one hundred fifty six pounds!</p><p class=\"zh\">第一个故事！一个超级大的南瓜！重达三千一百五十六磅！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Three thousand?! Heavier than my teacher&#x27;s car!</p><p class=\"zh\">三千多？！比我老师的车还重！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Heavier than two whole cows! Ron Wallace grew it in Rhode Island! Weighed on October tenth!</p><p class=\"zh\">比两头整牛还重！这是 Ron Wallace 在罗德岛种出来的！十月十日称的重！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Did it win?</p><p class=\"zh\">它赢了吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It smashed the world record! The first pumpkin ever over three thousand pounds! Funny part? One week earlier, a British man&#x27;s pumpkin named Bagheera broke the record!</p><p class=\"zh\">它打破了世界纪录！史上第一个超过三千磅的南瓜！好笑的是，一周前，一个英国人的南瓜 Bagheera 刚破了纪录！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bagheera! Like the black panther!</p><p class=\"zh\">Bagheera！像《丛林之书》里的黑豹！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Right?! But Ron&#x27;s pumpkin was three hundred pounds heavier! Bye bye, Bagheera!</p><p class=\"zh\">对吧？！可 Ron 的南瓜重了整整三百磅！Bagheera 的纪录，拜拜啦！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I want to live in it! A pumpkin house!</p><p class=\"zh\">我想住在里面！南瓜小屋！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! With a pumpkin doorbell! Ding dong! Who is at the door?</p><p class=\"zh\">哈哈！再装个南瓜门铃！叮咚！谁在敲门呀？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! A mushroom taller than your school ruler!</p><p class=\"zh\">第二个故事！一株比你的学校尺子还高的蘑菇！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can you eat it?</p><p class=\"zh\">能吃吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Whoa, not this one! Scientists found it in the forests of Yunnan, China! Over fifty centimeters tall! Almost five pounds!</p><p class=\"zh\">哇，这个可不行！科学家在中国云南的森林里发现了它！五十多厘米高！快五磅重！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">As heavy as my cat!</p><p class=\"zh\">跟我的猫一样重！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Close! Its nickname is D-rex!</p><p class=\"zh\">差不多！它的外号叫 D-rex！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Like T-rex? A dinosaur mushroom?</p><p class=\"zh\">像霸王龙那样？恐龙蘑菇？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Yes! Its real name is dee-ah-JOO-nus rex! Huge for a fungus! The mushroom king!</p><p class=\"zh\">没错！它的真名叫 dee-ah-JOO-nus rex！在真菌里算巨无霸了！蘑菇之王！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Did a dinosaur plant it?</p><p class=\"zh\">是恐龙种的吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Oh Lina, only you would ask that! It grew out of fallen wood! But get this! The biggest fungus ever in its giant family, with its own brand new family name!</p><p class=\"zh\">哎呀 Lina，只有你会这么问！它是从倒下的木头里长出来的！更厉害的是，它是它那个大家族里发现过的最大的真菌，还拥有了自己全新的家族名！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">The king needs a royal family!</p><p class=\"zh\">国王得有个王室家族！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! All hail the mushroom king!</p><p class=\"zh\">哈哈！向蘑菇国王致敬！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! A robot car just set a record on Mars!</p><p class=\"zh\">第三个故事！一辆机器人小车刚在火星上创了纪录！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Who is driving it?</p><p class=\"zh\">谁在开它？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Nobody! NASA&#x27;s Perseverance rover drives itself!</p><p class=\"zh\">没人！NASA 的毅力号火星车自己开！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A self driving car on another planet?</p><p class=\"zh\">在别的星球上自动驾驶的车？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Totally! Forty five point two kilometers! The longest drive EVER on another world! Longer than all the Moon cars!</p><p class=\"zh\">没错！开了四十五点二公里！人类在异星上开过的最长距离！比月球上所有的车都远！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I want a Mars rock!</p><p class=\"zh\">我想要一块火星石头！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Oh, me too! Someday, maybe!</p><p class=\"zh\">啊，我也想要！也许有一天吧！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Word of the day! Remember Lina&#x27;s sneaky question?</p><p class=\"zh\">今日单词！还记得 Lina 刚才那个机灵的问题吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Gigantic!</p><p class=\"zh\">gigantic！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Gigantic! Really, really, REALLY big! Say it with us, friends! Gigantic!</p><p class=\"zh\">gigantic！就是非常非常非常大的意思！跟我们一起说！gigantic！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Gigantic!</p><p class=\"zh\">gigantic！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">One more time! Like a giant monster! Gi-GAN-tic!</p><p class=\"zh\">再来一遍！像巨型怪兽那样！Gi-GAN-tic！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Gi-GAN-tic!</p><p class=\"zh\">Gi-GAN-tic！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha ha! You sound like a true giant!</p><p class=\"zh\">哈哈哈！你听起来像个真正的巨人！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Would you rather time!</p><p class=\"zh\">二选一时间到！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ooh! My favorite game!</p><p class=\"zh\">哦！我最喜欢的游戏！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ride a gigantic pumpkin as big as a car down a hill? Or drive a robot car all the way across Mars?</p><p class=\"zh\">骑在一个汽车一样大的南瓜上滚下山坡，还是开着机器人小车横穿整个火星？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">The pumpkin! I want the pumpkin house on wheels!</p><p class=\"zh\">选南瓜！我要带轮子的南瓜小屋！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ooh, of course! Friends, which would YOU pick? Ask your mom and dad too!</p><p class=\"zh\">当然啦！小朋友们，你们选哪个？也问问爸爸妈妈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">If you pick Mars, bring me back a rock!</p><p class=\"zh\">如果你选火星，记得给我带块石头回来！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That&#x27;s all for today! Thanks for listening, friends! Bye!</p><p class=\"zh\">今天就到这里！谢谢收听，小朋友们！拜拜！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I am off to find a mushroom king!</p><p class=\"zh\">拜拜！我要去找蘑菇国王啦！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">gigantic<span>（巨大的）</span></div><div class=\"vocab-def\">really, really, REALLY big</div><div class=\"vocab-ex\">例：a gigantic pumpkin（巨大的南瓜）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">weigh<span>（重达）</span></div><div class=\"vocab-def\">to be how heavy something is</div><div class=\"vocab-ex\">例：it weighs three thousand pounds（它重达三千磅）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">fungus<span>（真菌）</span></div><div class=\"vocab-def\">a living thing like a mushroom, but not a plant</div><div class=\"vocab-ex\">例：a giant fungus（巨型真菌）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">rover<span>（火星车）</span></div><div class=\"vocab-def\">a small robot car that explores new places</div><div class=\"vocab-ex\">例：the Mars rover（火星车）</div></div></div>\n    </article>"}, {"date": "2026-10-13", "row": "<div class=\"ep-row\" data-date=\"2026-10-13\"><div class=\"ep-row-title\">小小英文新鲜事 - 1013 | 转圈小行星、长角海参、6岁魔方纪录</div><div class=\"ep-row-meta\">2026-10-13 · 456 词 · Word of the day: trickster</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1013 | 转圈小行星、长角海参、6岁魔方纪录</h2>\n      <div class=\"meta\">2026-10-13 · 全文 456 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>转圈小行星</li><li>长角海参</li><li>6岁魔方纪录</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-13.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">trickster<span>（捣蛋鬼）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>小挑战：像小行星一样转圈，一分钟你能转几圈？用英语数出来，再教家人今天的单词 trickster！</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey friends, welcome back! I&#x27;m Mia!</p><p class=\"zh\">大家好，欢迎回来！我是 Mia！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Tuesday, October thirteenth!</p><p class=\"zh\">我是 Lina！今天是十月十三号，星期二！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">We have three brand new stories for you today! Are you ready?</p><p class=\"zh\">今天我们有三个全新的故事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Born ready! Bring them on!</p><p class=\"zh\">早就准备好啦！快开始吧！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! Two giant space rocks are spinning like crazy!</p><p class=\"zh\">第一个故事！两块巨大的太空岩石正在疯狂旋转！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Like a merry go round?</p><p class=\"zh\">像旋转木马那样吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Even faster! Each one is wider than twenty football fields, and it spins all the way around every five minutes!</p><p class=\"zh\">比那还快！每一块都有二十个足球场那么宽，每五分钟就能转上一整圈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Whoa! I would get so dizzy!</p><p class=\"zh\">哇！我肯定会转晕的！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Tell me about it! Scientists just found them with a giant telescope in Chile! They spin so fast that they should break into pieces!</p><p class=\"zh\">哈哈，可不是嘛！科学家们用智利的一台巨型望远镜刚刚发现了它们！它们转得太快了，按理说早就该碎成渣了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">So why do they not fall apart?</p><p class=\"zh\">那它们为什么没有散架呢？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Because they are super strong solid rocks! The scientists were totally amazed!</p><p class=\"zh\">因为它们是超级结实的整块岩石！科学家们都惊呆了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can I ride one to school?</p><p class=\"zh\">我能骑着它去上学吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! You would fly right off! Spin, spin, spin, and you are gone!</p><p class=\"zh\">哈哈！你会被甩飞的！转啊转啊转，嗖——你就不见啦！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story two! Scientists found fifty seven brand new animals deep in the ocean!</p><p class=\"zh\">第二个故事！科学家们在深海里发现了五十七种全新的动物！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Fifty seven?! Do they all have names?</p><p class=\"zh\">五十七种？！它们都有名字吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">One of them does! A sea cucumber with two little horns, nicknamed Loki!</p><p class=\"zh\">其中一只已经有名字了！一只长着两只小角的海参，大家给它起了个昵称叫 Loki！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Loki? Like the troublemaker god?</p><p class=\"zh\">Loki？就是那个爱捣蛋的神吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Exactly! That name is perfect for our word of the day later! Loki lives more than two thousand meters under the sea!</p><p class=\"zh\">没错！这个名字和我们今天的每日单词特别配！Loki 住在两千多米深的海底！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Does it play tricks on the fish down there?</p><p class=\"zh\">它会在海底捉弄小鱼吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Maybe it waves its little horns and says, look at me!</p><p class=\"zh\">哈哈！说不定它正挥舞着小角说：快看我呀！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story three! A six year old girl solved a Rubik&#x27;s Cube in about four seconds!</p><p class=\"zh\">第三个故事！一个六岁的小女孩只用了四秒钟就复原了一个魔方！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Four seconds?! I can&#x27;t even find my socks in four seconds!</p><p class=\"zh\">四秒钟？！我连袜子都找不到！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! I know, right?! Her name is lee-AHN yoon-JUH, from China! And she broke the women&#x27;s world record! Twice!</p><p class=\"zh\">哈哈，我懂你！她叫连允之，来自中国！她打破了女子魔方世界纪录！还是两次！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Is she a robot?</p><p class=\"zh\">她是机器人吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! No, she&#x27;s a real kid! Just like you! A world record means nobody in the whole world has ever done it better!</p><p class=\"zh\">哈哈！不是，她是个真正的小朋友！和你一样！世界纪录的意思是，全世界从来没有人做得比她更好！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I want a world record for eating noodles!</p><p class=\"zh\">我想创一个吃面条的世界纪录！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! That is a delicious dream! Maybe start with breakfast first!</p><p class=\"zh\">哈哈！这个梦想真美味！不过先从吃好早餐开始吧！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay! Word of the day! Trickster! A trickster is someone who loves to play tricks and jokes! Like Loki the sea cucumber!</p><p class=\"zh\">好啦！今日单词！Trickster！Trickster 就是喜欢搞恶作剧、开玩笑的人！就像海参 Loki！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Or like me!</p><p class=\"zh\">或者像我！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! You said it, not me! Trickster! Say it with us, friends!</p><p class=\"zh\">哈哈！这可是你自己说的！Trickster！小朋友们，跟我们一起说！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Trickster!</p><p class=\"zh\">Trickster！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Spot on! Say it one more time, super silly!</p><p class=\"zh\">说得太对了！再说一遍，这次要超级搞笑！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">TRICK-ster!</p><p class=\"zh\">TRICK-ster！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha ha! Perfect!</p><p class=\"zh\">哈哈哈！完美！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay! Tiny challenge time! Here is your mission!</p><p class=\"zh\">好啦！小挑战时间到！这是你的任务！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A mission?! I love missions!</p><p class=\"zh\">任务？！我最喜欢任务了！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Spin like the super fast asteroids! See how many spins you can do in one minute! And count out loud in English! One! Two! Three!</p><p class=\"zh\">像超快的小行星一样转圈！看看一分钟你能转几圈！还要用英语大声数出来！One！Two！Three！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And teach someone the word trickster today!</p><p class=\"zh\">还要把今天的单词 trickster 教给别人！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Yes! Teach your mom and dad! Ask them to spin with you! The whole family, spinning in circles!</p><p class=\"zh\">哈哈！没错！教给爸爸妈妈！让他们陪你一起转圈！全家一起转圈圈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Mom is going to get so dizzy!</p><p class=\"zh\">妈妈肯定会转晕的！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! That is the fun part!</p><p class=\"zh\">哈哈！好玩的就是这个！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">That&#x27;s all for today! Thanks for listening, friends! See you next time! Bye!</p><p class=\"zh\">今天就到这里啦！谢谢收听，小朋友们！下次见！拜拜！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I&#x27;m off to spin!</p><p class=\"zh\">我去转圈啦！拜拜！</p></div></div></div>\n      </details>\n      \n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">trickster<span>（捣蛋鬼）</span></div><div class=\"vocab-def\">a person who loves to play tricks and jokes</div><div class=\"vocab-ex\">例：Loki the trickster（爱捣蛋的 Loki）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">spin<span>（旋转）</span></div><div class=\"vocab-def\">to turn around and around very fast</div><div class=\"vocab-ex\">例：the asteroid spins every five minutes（小行星每五分钟转一圈）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">horn<span>（角）</span></div><div class=\"vocab-def\">a hard pointy part on some animals&#x27; heads</div><div class=\"vocab-ex\">例：two little horns（两只小角）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">record<span>（纪录）</span></div><div class=\"vocab-def\">the best score anyone has ever done</div><div class=\"vocab-ex\">例：a world record（世界纪录）</div></div></div>\n    </article>"}, {"date": "2026-10-11", "row": "<div class=\"ep-row\" data-date=\"2026-10-11\"><div class=\"ep-row-title\">小小英文新鲜事 - 1011 | 猎豹五胞胎、远古水獭、火星伴蜂巢</div><div class=\"ep-row-meta\">2026-10-11 · 392 词 · Word of the day: cub</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1011 | 猎豹五胞胎、远古水獭、火星伴蜂巢</h2>\n      <div class=\"meta\">2026-10-11 · 全文 392 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>猎豹五胞胎</li><li>远古水獭</li><li>火星伴蜂巢</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-11.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">cub<span>（幼崽）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>谜语时间：有斑点像豹、跑得比汽车快、会喵喵叫，但不是家猫——我是谁？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey everyone, welcome back! I&#x27;m Mia.</p><p class=\"zh\">大家好，欢迎回来！我是 Mia。</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Sunday, October eleventh!</p><p class=\"zh\">我是 Lina！今天是十月十一号，星期天！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">We&#x27;ve got three amazing stories for you today! Ready?</p><p class=\"zh\">今天我们有三个超棒的故事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ready ready ready! Go go go!</p><p class=\"zh\">准备好了准备好了！冲冲冲！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! Five baby cheetahs were just born!</p><p class=\"zh\">第一个故事！五只猎豹宝宝出生了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Five?! That&#x27;s a lot of babies!</p><p class=\"zh\">五只？！好多宝宝！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I know! At the Smithsonian Zoo! Their mom is named Zura, and it&#x27;s her first time be
