<script>
const EPISODES = [{"date": "2026-10-11", "row": "<div class=\"ep-row\" data-date=\"2026-10-11\"><div class=\"ep-row-title\">小小英文新鲜事 - 1011 | 猎豹五胞胎、远古水獭、火星伴蜂巢</div><div class=\"ep-row-meta\">2026-10-11 · 392 词 · Word of the day: cub</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1011 | 猎豹五胞胎、远古水獭、火星伴蜂巢</h2>\n      <div class=\"meta\">2026-10-11 · 全文 392 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>猎豹五胞胎</li><li>远古水獭</li><li>火星伴蜂巢</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-11.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">cub<span>（幼崽）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>谜语时间：有斑点像豹、跑得比汽车快、会喵喵叫，但不是家猫——我是谁？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey everyone, welcome back! I&#x27;m Mia.</p><p class=\"zh\">大家好，欢迎回来！我是 Mia。</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Sunday, October eleventh!</p><p class=\"zh\">我是 Lina！今天是十月十一号，星期天！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">We&#x27;ve got three amazing stories for you today! Ready?</p><p class=\"zh\">今天我们有三个超棒的故事！准备好了吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ready ready ready! Go go go!</p><p class=\"zh\">准备好了准备好了！冲冲冲！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Story one! Five baby cheetahs were just born!</p><p class=\"zh\">第一个故事！五只猎豹宝宝出生了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Five?! That&#x27;s a lot of babies!</p><p class=\"zh\">五只？！好多宝宝！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I know! At the Smithsonian Zoo! Their mom is named Zura, and it&#x27;s her first time being a mom!</p><p class=\"zh\">我知道！在史密森尼动物园！它们的妈妈叫 Zura，这是她第一次当妈妈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Is she doing a good job?</p><p class=\"zh\">她做得好吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">She&#x27;s doing great! The cubs are so tiny, they pile on top of each other to nap! And you can watch them on a live camera!</p><p class=\"zh\">做得超好！小宝宝们小小的，堆在一起睡觉！你还可以在直播镜头里看它们！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A cheetah channel?! I want to watch!</p><p class=\"zh\">猎豹频道？！我要看！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Me too! And here&#x27;s our word of the day: cub. A cub is a baby animal, like a baby lion, a baby bear, or a baby cheetah!</p><p class=\"zh\">哈哈！我也要！来看看我们今天的单词：cub。Cub 就是幼崽，像小狮子、小熊或者小猎豹！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">So I&#x27;m a human cub?</p><p class=\"zh\">那我是人类幼崽？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Human babies are just called babies, silly! But I like how you think! Say it with us, friends! Cub!</p><p class=\"zh\">哈哈！人类宝宝就叫宝宝，傻瓜！不过我喜欢你的想法！跟我们一起说，朋友们！Cub！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Cub!</p><p class=\"zh\">Cub！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Nailed it! Okay, story two! Scientists found a fossil of an animal that lived with the dinosaurs!</p><p class=\"zh\">说得太好了！好，第二个故事！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A dinosaur?!</p><p class=\"zh\">恐龙？！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Not quite! It was a mammal, like us! It lived one hundred sixty-five million years ago in China! It looked like a cross between an otter and a beaver!</p><p class=\"zh\">不完全是！它是哺乳动物，跟我们一样！它生活在一亿六千五百万年前的中国！长得像水獭和河狸的合体！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">An otter-beaver?!</p><p class=\"zh\">水獭河狸？！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Yes! It swam with its front legs and steered with its flat tail! And get this, it could chew its food AND breathe at the same time!</p><p class=\"zh\">对！它用前腿游泳，用扁扁的尾巴控制方向！而且你猜怎么着，它可以一边嚼东西一边呼吸！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I can do that! Watch! Nom nom nom!</p><p class=\"zh\">我也会！看！啊呜啊呜啊呜！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha ha! Careful, don&#x27;t choke! Okay, last story! Look up at the sky tonight!</p><p class=\"zh\">哈哈哈！小心别噎着！好，最后一个故事！今晚抬头看天！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Why? Is something falling?</p><p class=\"zh\">为什么？有东西掉下来吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Mars! The red planet is passing right through a group of stars called the Beehive Cluster!</p><p class=\"zh\">火星！这颗红色星球正在穿过一群叫蜂巢星团的星星！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bees in space?!</p><p class=\"zh\">太空里有蜜蜂？！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Not real bees! It&#x27;s called the Beehive because the stars look like a swarm of bees! Mars will look like it&#x27;s sitting right inside it!</p><p class=\"zh\">哈哈！不是真的蜜蜂！叫蜂巢是因为这些星星看起来像一群蜜蜂！火星看起来就像坐在里面！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can I see it?</p><p class=\"zh\">我能看到吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">If the sky is clear, look east before sunrise! Mars is the red one! Can you believe it?</p><p class=\"zh\">如果天晴，日出前看东边！红色的那颗就是！你敢相信吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I&#x27;m waking up early!</p><p class=\"zh\">我要早起！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay, riddle time!</p><p class=\"zh\">好，谜语时间！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ooh! I have spots like a leopard, but I&#x27;m not a leopard! I run faster than a car, but I&#x27;m not a car! I say meow, but I&#x27;m not your house cat! What am I?</p><p class=\"zh\">哦！我有像豹一样的斑点，但我不是豹！我跑得比汽车快，但我不是汽车！我会喵喵叫，但我不是你家的猫！我是谁？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hmm... a cheetah!</p><p class=\"zh\">嗯……猎豹！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">You got it! You&#x27;re so smart!</p><p class=\"zh\">你答对了！你真聪明！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Thanks for hanging out with us! See you next time! Bye!</p><p class=\"zh\">哈！谢谢你们陪我们！下次见！拜拜！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I&#x27;m going to watch the cheetah cam!</p><p class=\"zh\">拜拜！我要去看猎豹直播了！</p></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">cub<span>（幼崽）</span></div><div class=\"vocab-def\">a baby animal, like a baby lion or bear</div><div class=\"vocab-ex\">例：five cheetah cubs（五只猎豹宝宝）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">pile<span>（堆叠）</span></div><div class=\"vocab-def\">to put things on top of each other</div><div class=\"vocab-ex\">例：they pile up to nap（它们堆在一起睡觉）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">fossil<span>（化石）</span></div><div class=\"vocab-def\">what&#x27;s left of an animal or plant from long ago, turned into rock</div><div class=\"vocab-ex\">例：a dinosaur fossil（恐龙化石）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">cluster<span>（一团；星团）</span></div><div class=\"vocab-def\">a group of the same things close together</div><div class=\"vocab-ex\">例：a star cluster（星团）</div></div></div>\n    </article>"}, {"date": "2026-10-10", "row": "<div class=\"ep-row\" data-date=\"2026-10-10\"><div class=\"ep-row-title\">小小英文新鲜事 - 1010 | 百年新野猫、金字塔鳄鱼、太空皮卡丘</div><div class=\"ep-row-meta\">2026-10-10 · 428 词 · Word of the day: fossil</div></div>", "detail": "\n    <button class=\"back\" onclick=\"showList()\">← 返回列表</button>\n    <article class=\"ep\">\n      <h2>🦁 小小英文新鲜事 - 1010 | 百年新野猫、金字塔鳄鱼、太空皮卡丘</h2>\n      <div class=\"meta\">2026-10-10 · 全文 428 词</div>\n      <div class=\"stories\"><b>📖 今天的三个新鲜事</b><ul><li>百年新野猫</li><li>金字塔鳄鱼</li><li>太空皮卡丘</li></ul></div>\n      <audio controls preload=\"none\" src=\"https://raw.githubusercontent.com/solarco/xiaoyuzhou-kids-manifest/main/mp3/2026-10-10-1.mp3\"></audio>\n      <div class=\"wordcard\"><div class=\"wordcard-title\">📖 Word of the day</div>\n        <div class=\"wordcard-word\">fossil<span>（化石）</span></div></div>\n      <div class=\"game\"><div class=\"game-title\">🎮 结尾小游戏</div>\n        <p>Lina 的无厘头二选一：抱抱小野猫，还是骑在鳄鱼化石背上？你选哪个？</p></div>\n      <details open>\n        <summary>📄 中英对照文字稿（跟读用）</summary>\n        <div class=\"transcript\"><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hey everyone, welcome back! I&#x27;m Mia.</p><p class=\"zh\">大家好，欢迎回来！我是 Mia。</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">And I&#x27;m Lina! It&#x27;s Saturday, October tenth!</p><p class=\"zh\">我是 Lina！今天是十月十号，星期六！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">We&#x27;ve got three brand-new stories for you today! All super fresh!</p><p class=\"zh\">今天我们有三个超级新鲜的故事！都新鲜出炉！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Fresh like my socks? I changed them today!</p><p class=\"zh\">新鲜得像我的袜子？我今天刚换的！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Even fresher! Story one! Scientists found a brand-new wild cat!</p><p class=\"zh\">哈哈！比那还新鲜！第一个故事！科学家发现了一种全新的野猫！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A new cat?! Like my neighbor&#x27;s cat?</p><p class=\"zh\">新猫？！像我邻居家的猫吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It LOOKS like a regular house cat! That&#x27;s the funny part! People in Bolivia saw it for years and thought, oh, just a cute kitty!</p><p class=\"zh\">它长得就像普通的家猫！好笑的就是这个！玻利维亚的人们看了它好几年，都以为：哦，就是只可爱的小猫咪！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Plot twist! It&#x27;s NOT a kitty?</p><p class=\"zh\">反转！它不是小猫咪？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It&#x27;s a whole new species! Called the Tilkayo tiger cat! It has leopard spots! And get this, it&#x27;s the first new wild cat found in one hundred years!</p><p class=\"zh\">它是一个全新的物种！叫 Tilkayo 虎斑猫！身上有豹纹！而且你猜怎么着——这是一百年来发现的第一种新野猫！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">One hundred years?! That&#x27;s older than grandma!</p><p class=\"zh\">一百年？！比奶奶年纪还大！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha! Way older! It&#x27;s tiny, with round ears. So cute! Can you believe it?</p><p class=\"zh\">哈哈！大多了！它小小的，长着圆耳朵，超可爱！你敢相信吗？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Can I have one? Please please please?</p><p class=\"zh\">我能养一只吗？求求你求求你？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It&#x27;s wild, sweetie. But here&#x27;s our word of the day: fossil. A fossil is what&#x27;s left of an animal or plant from super long ago, turned into rock!</p><p class=\"zh\">它是野生的，宝贝。不过来看看我们今天的单词：fossil。Fossil 就是化石，是超级久以前的动物或植物留下的、变成石头的东西！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Like dinosaur bones?</p><p class=\"zh\">像恐龙骨头那样？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Exactly! Say it with us, friends! Fossil!</p><p class=\"zh\">没错！跟我们一起说，朋友们！Fossil！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Fossil!</p><p class=\"zh\">Fossil！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">I love how you said that! Okay, story two! You know the Great Sphinx in Egypt? The giant lion with a human head?</p><p class=\"zh\">我喜欢你说的方式！好，第二个故事！你知道埃及的狮身人面像吗？那个长着人头的大狮子？</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">The one with no nose?</p><p class=\"zh\">那个没有鼻子的吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Yes! Well, scientists found a fossil INSIDE the rock the Sphinx is carved from!</p><p class=\"zh\">哈哈！对！科学家在雕刻狮身人面像的那块岩石里面，发现了一块化石！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Inside?! Was someone hiding it there?</p><p class=\"zh\">在里面？！是有人把它藏在那的吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">It was waiting there for forty-five million years! It&#x27;s a brand-new species of ancient crocodile with a super long, skinny snout! They named it after Horus, an Egyptian god!</p><p class=\"zh\">它在那等了四千五百万年！那是一种全新的远古鳄鱼，长着超长超细的鼻子！人们用埃及神 Horus 的名字给它命名！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">A crocodile god?! Does it wear a crown?</p><p class=\"zh\">鳄鱼神？！它戴王冠吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha ha ha! I love how you think! Maybe a tiny crown!</p><p class=\"zh\">哈哈哈！我就喜欢你的想法！也许戴个小王冠！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I knew it!</p><p class=\"zh\">我就知道！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Okay, last story, and it&#x27;s my favorite! A Pikachu toy spent sixty-seven days in space!</p><p class=\"zh\">好，最后一个故事，也是我最喜欢的！一只皮卡丘玩偶在太空里待了六十七天！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">WHAT?! Pikachu went to space?!</p><p class=\"zh\">什么？！皮卡丘去太空了？！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Yes! It floated around the International Space Station for sixty-seven days! I know, it&#x27;s amazing!</p><p class=\"zh\">对！它在国际空间站里漂了六十七天！我知道，太神奇了！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Did it catch any space Pokémon?</p><p class=\"zh\">它抓到太空宝可梦了吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! Maybe! And now there&#x27;s a Pokémon Space Trail at a museum in London, where kids learn about space with Pokémon!</p><p class=\"zh\">哈哈！也许吧！现在伦敦的一家博物馆有宝可梦太空小径，小朋友们可以和宝可梦一起学太空知识！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I want to go! Can Pikachu be my teacher?</p><p class=\"zh\">我想去！皮卡丘能当我的老师吗？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Best teacher ever! Okay, it&#x27;s game time!</p><p class=\"zh\">最棒的老师！好，游戏时间到！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Ooh, my favorite! Would you rather... cuddle the tiny Tilkayo tiger cat, or ride on the back of the giant fossil crocodile?</p><p class=\"zh\">哦，我最喜欢的！二选一……抱抱小小的 Tilkayo 虎斑猫，还是骑在巨大的鳄鱼化石背上？</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Hmm, tough one... I&#x27;d cuddle the kitty! Those round ears! What about you, friends? Ask your mom and dad too!</p><p class=\"zh\">嗯，好难选……我要抱小猫咪！那圆耳朵！你们呢，朋友们？也去问问爸爸妈妈！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">I&#x27;d ride the crocodile! Giddy-up, Horus!</p><p class=\"zh\">我要骑鳄鱼！驾！Horus 跑起来！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Ha! I love it! Amazing choice!</p><p class=\"zh\">哈！我就知道！选得好！</p></div></div><div class=\"turn mia\"><span class=\"speaker\">Mia</span><div class=\"lines\"><p class=\"en\">Thanks for hanging out with us! See you next time! Bye!</p><p class=\"zh\">谢谢你们陪我们！下次见！拜拜！</p></div></div><div class=\"turn lina\"><span class=\"speaker\">Lina</span><div class=\"lines\"><p class=\"en\">Bye! I&#x27;m going to find a fossil!</p><p class=\"zh\">拜拜！我要去找化石了！</p></div></div></div>\n      </details>\n      <div class=\"vocab\"><div class=\"vocab-title\">📝 生词本</div><div class=\"vocab-item\"><div class=\"vocab-word\">fossil<span>（化石）</span></div><div class=\"vocab-def\">what&#x27;s left of an animal or plant from long ago, turned into rock</div><div class=\"vocab-ex\">例：a dinosaur fossil（恐龙化石）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">species<span>（物种）</span></div><div class=\"vocab-def\">a group of animals or plants that are all the same kind</div><div class=\"vocab-ex\">例：a new species of wild cat（一种新的野猫）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">snout<span>（吻部；动物的鼻子）</span></div><div class=\"vocab-def\">the nose and mouth part of an animal</div><div class=\"vocab-ex\">例：a crocodile&#x27;s long snout（鳄鱼的长吻）</div></div><div class=\"vocab-item\"><div class=\"vocab-word\">float<span>（漂浮）</span></div><div class=\"vocab-def\">to stay in the air or on water without falling down</div><div class=\"vocab-ex\">例：Pikachu floated in space（皮卡丘在太空里漂浮）</div></div></div>\n    </article>"}];
const listView = document.getElementById('listView');
const detailView = document.getElementById('detailView');
const zhToggle = document.getElementById('zhToggle');
function showList() {
  detailView.style.display = 'none';
  listView.style.display = 'block';
  zhToggle.style.display = 'none';
  listView.innerHTML = EPISODES.map(e => e.row).join('');
  listView.querySelectorAll('.ep-row').forEach(r => {
    r.onclick = () => showDetail(r.dataset.date);
  });
  window.scrollTo(0, 0);
}
function showDetail(date) {
  const ep = EPISODES.find(e => e.date === date);
  if (!ep) return;
  listView.style.display = 'none';
  detailView.style.display = 'block';
  zhToggle.style.display = 'block';
  detailView.innerHTML = ep.detail;
  window.scrollTo(0, 0);
}
zhToggle.onclick = () => {
  document.body.classList.toggle('hide-zh');
  zhToggle.textContent = document.body.classList.contains('hide-zh') ? '显示译文' : '隐藏译文';
};
showList();
</script>
